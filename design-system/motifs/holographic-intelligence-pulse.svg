<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Color Definitions -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Animation for pulse effect -->
    <animateTransform
      id="pulseAnim1"
      attributeName="transform"
      type="scale"
      values="1; 1.5; 1"
      dur="2s"
      repeatCount="indefinite"
      additive="sum"
    />
    
    <animateTransform
      id="pulseAnim2"
      attributeName="transform"
      type="scale"
      values="1; 1.3; 1"
      dur="2s"
      repeatCount="indefinite"
      additive="sum"
      begin="0.5s"
    />
    
    <animateTransform
      id="pulseAnim3"
      attributeName="transform"
      type="scale"
      values="1; 1.1; 1"
      dur="2s"
      repeatCount="indefinite"
      additive="sum"
      begin="1s"
    />
    
    <filter id="pulseSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Pulse Element -->
  <g id="holographicPulse">
    
    <!-- Outer Pulse Ring (Largest, slowest) -->
    <circle cx="100" cy="100" r="80" 
            fill="none" 
            stroke="#00D4FF" 
            stroke-width="2" 
            opacity="0.4"
            filter="url(#pulseSoftGlow)">
      <animate attributeName="r" values="80; 90; 80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4; 0.2; 0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Middle Pulse Ring -->
    <circle cx="100" cy="100" r="60" 
            fill="none" 
            stroke="#00D4FF" 
            stroke-width="2" 
            opacity="0.6"
            filter="url(#pulseSoftGlow)">
      <animate attributeName="r" values="60; 70; 60" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.6; 0.3; 0.6" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
    <!-- Inner Pulse Ring -->
    <circle cx="100" cy="100" r="40" 
            fill="none" 
            stroke="#00D4FF" 
            stroke-width="2" 
            opacity="0.8">
      <animate attributeName="r" values="40; 45; 40" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Central Core -->
    <circle cx="100" cy="100" r="20" fill="url(#pulseGlow)" stroke="#00D4FF" stroke-width="1"/>
    
    <!-- Core Point -->
    <circle cx="100" cy="100" r="6" fill="#00D4FF"/>
    <circle cx="100" cy="100" r="3" fill="#00FFFF"/>
    
    <!-- Scan Lines (Static) -->
    <g id="pulseScanLines" opacity="0.3">
      <line x1="100" y1="100" x2="100" y2="20" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="100" y1="100" x2="170" y2="30" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="100" y1="100" x2="200" y2="100" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="100" y1="100" x2="170" y2="170" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="100" y1="100" x2="100" y2="180" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="100" y1="100" x2="30" y2="170" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="100" y1="100" x2="0" y2="100" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="100" y1="100" x2="30" y2="30" stroke="#00D4FF" stroke-width="0.5"/>
    </g>
    
    <!-- Data Points -->
    <g id="pulseDataPoints">
      <circle cx="100" cy="20" r="1" fill="#00D4FF" opacity="0.8">
        <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="30" r="1" fill="#00D4FF" opacity="0.8">
        <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="2.2s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <circle cx="200" cy="100" r="1" fill="#00D4FF" opacity="0.8">
        <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="2.4s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
      <circle cx="170" cy="170" r="1" fill="#00D4FF" opacity="0.8">
        <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="2.6s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="100" cy="180" r="1" fill="#00D4FF" opacity="0.8">
        <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <circle cx="30" cy="170" r="1" fill="#00D4FF" opacity="0.8">
        <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="3s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="0" cy="100" r="1" fill="#00D4FF" opacity="0.8">
        <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="30" cy="30" r="1" fill="#00D4FF" opacity="0.8">
        <animate attributeName="opacity" values="0.8; 0.4; 0.8" dur="2.7s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
    </g>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Holographic Intelligence - Pulse</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Animated pulse element for active states and processing indicators.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

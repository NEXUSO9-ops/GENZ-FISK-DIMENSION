<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="headManeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="50%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#C0C0C0"/>
    </linearGradient>
    
    <radialGradient id="headEyeGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </radialGradient>
    
    <linearGradient id="headCrownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F4E48C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <filter id="headSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Lion Head -->
  <g id="sentinelHead">
    
    <!-- Head Base -->
    <path d="M40 120 Q60 80 100 70 Q140 60 160 100 Q160 120 140 140 Q100 140 80 120 Q60 100 40 120 Z"
          fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1.5" filter="url(#headSoftShadow)"/>
    
    <!-- Mane -->
    <path d="M60 80 Q40 60 30 50 Q40 40 60 50 Q80 60 90 80 Q80 100 60 110 Q40 120 40 100 Q50 80 60 80 Z"
          fill="url(#headManeGradient)" stroke="#A0A0A0" stroke-width="0.5"/>
    
    <path d="M100 70 Q120 50 140 40 Q150 40 160 60 Q150 80 130 90 Q120 100 100 100 Q90 100 80 90 Q80 70 100 70 Z"
          fill="url(#headManeGradient)" stroke="#A0A0A0" stroke-width="0.5"/>
    
    <!-- Ears -->
    <path d="M60 50 Q50 40 45 20 Q50 10 60 20 Q70 30 60 50 Z"
          fill="#F8F9FA" stroke="#E0E0E0" stroke-width="0.5"/>
    <path d="M55 30 Q50 25 50 15 Q55 10 60 20 Q55 30 Z" fill="#E0E0E0" stroke="none"/>
    
    <path d="M140 50 Q150 40 155 20 Q150 10 140 20 Q130 30 140 50 Z"
          fill="#F8F9FA" stroke="#E0E0E0" stroke-width="0.5"/>
    <path d="M145 30 Q150 25 150 15 Q145 10 140 20 Q145 30 Z" fill="#E0E0E0" stroke="none"/>
    
    <!-- Eyes (Icy Cyan) -->
    <ellipse cx="100" cy="90" rx="8" ry="6" fill="#0F172A"/>
    <ellipse cx="100" cy="90" rx="5" ry="3" fill="url(#headEyeGlow)"/>
    <circle cx="102" cy="88" r="1" fill="#00D4FF"/>
    <circle cx="100" cy="90" r="1.5" fill="#0A0A0F"/>
    
    <ellipse cx="130" cy="85" rx="8" ry="6" fill="#0F172A"/>
    <ellipse cx="130" cy="85" rx="5" ry="3" fill="url(#headEyeGlow)"/>
    <circle cx="132" cy="83" r="1" fill="#00D4FF"/>
    <circle cx="130" cy="85" r="1.5" fill="#0A0A0F"/>
    
    <!-- Nose and Mouth -->
    <path d="M115 110 Q120 115 125 110" stroke="#0F172A" stroke-width="1" fill="none"/>
    <ellipse cx="115" cy="105" rx="2.5" ry="1.5" fill="#0F172A"/>
    
    <!-- Crown (Antique Gold with Sapphire Jewels) -->
    <g id="headCrown">
      <!-- Crown Base -->
      <path d="M40 20 Q60 0 100 5 Q140 10 160 0 Q180 20 Q180 40 160 50 Q140 60 100 55 Q60 50 40 40 Q40 30 40 20 Z"
            fill="url(#headCrownGold)" stroke="#B8860B" stroke-width="1"/>
      
      <!-- Crown Points -->
      <path d="M100 5 L110 -10 L120 5 Z" fill="url(#headCrownGold)" stroke="#B8860B" stroke-width="0.3"/>
      <path d="M140 10 L150 -5 L160 10 Z" fill="url(#headCrownGold)" stroke="#B8860B" stroke-width="0.3"/>
      <path d="M60 0 L70 -15 L80 0 Z" fill="url(#headCrownGold)" stroke="#B8860B" stroke-width="0.3"/>
      
      <!-- Sapphire Jewels -->
      <circle cx="110" cy="5" r="3" fill="#1E3A8A"/>
      <circle cx="150" cy="10" r="3" fill="#1E3A8A"/>
      <circle cx="70" cy="0" r="3" fill="#1E3A8A"/>
      
      <!-- Jewel Highlights -->
      <circle cx="112" cy="3" r="0.5" fill="#00D4FF"/>
      <circle cx="152" cy="8" r="0.5" fill="#00D4FF"/>
      <circle cx="72" cy="-2" r="0.5" fill="#00D4FF"/>
      
      <!-- Crown Inner Detail -->
      <path d="M100 15 Q120 10 140 15 Q160 20 160 30 Q140 35 100 30 Q60 25 40 20 Q40 10 100 15 Z"
            stroke="#F4E48C" stroke-width="0.3" fill="none"/>
    </g>
    
    <!-- Contour Lines for Depth -->
    <path d="M70 80 Q80 70 90 60" stroke="#A0A0A0" stroke-width="0.3" fill="none"/>
    <path d="M110 80 Q120 70 130 80" stroke="#A0A0A0" stroke-width="0.3" fill="none"/>
  </g>
  
  <!-- Holographic Intelligence Accent -->
  <g id="headHolographic" opacity="0.15">
    <circle cx="100" cy="50" r="20" stroke="#00D4FF" stroke-width="0.3" fill="none"/>
    <circle cx="100" cy="50" r="30" stroke="#00D4FF" stroke-width="0.3" fill="none"/>
    <line x1="80" y1="40" x2="120" y2="40" stroke="#00D4FF" stroke-width="0.2"/>
    <line x1="80" y1="50" x2="120" y2="50" stroke="#00D4FF" stroke-width="0.2"/>
    <line x1="80" y1="60" x2="120" y2="60" stroke="#00D4FF" stroke-width="0.2"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Regal Sentinel - Head</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Crowned lion head for icons and small applications. 
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

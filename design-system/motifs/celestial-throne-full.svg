<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="throneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F4E48C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <linearGradient id="throneGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E48C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    
    <radialGradient id="celestialAtmosphere" cx="50%" cy="0%" r="100%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </radialGradient>
    
    <radialGradient id="volumetricLight" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="throneSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="lightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Column Fluting Pattern -->
    <pattern id="columnFluting" patternUnits="userSpaceOnUse" width="20" height="40">
      <path d="M0 0 L5 10 L10 0 L15 20 L20 0" stroke="#B8860B" stroke-width="0.5" fill="none"/>
    </pattern>
  </defs>
  
  <!-- Background: Celestial Gradient -->
  <rect width="800" height="600" fill="url(#celestialAtmosphere)"/>
  
  <!-- Distant Nebula (Subtle) -->
  <ellipse cx="400" cy="100" rx="300" ry="100" fill="#1E3A8A" opacity="0.4" 
           filter="url(#throneSoftShadow)"/>
  <ellipse cx="400" cy="100" rx="200" ry="80" fill="#00D4FF" opacity="0.1" 
           filter="url(#lightGlow)"/>
  
  <!-- Celestial Throne Structure -->
  <g id="celestialThrone">
    
    <!-- Base Platform -->
    <rect x="200" y="500" width="400" height="20" 
          fill="#1E3A8A" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- Steps -->
    <rect x="250" y="480" width="300" height="20" 
          fill="#1E3A8A" stroke="#D4AF37" stroke-width="1"/>
    <rect x="300" y="460" width="200" height="20" 
          fill="#1E3A8A" stroke="#D4AF37" stroke-width="1"/>
    <rect x="350" y="440" width="100" height="20" 
          fill="#1E3A8A" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Throne Chair -->
    <g id="throneChair">
      <!-- Seat -->
      <path d="M350 420 Q400 400 450 420 L450 440 Q400 460 350 440 Z"
            fill="#1E3A8A" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Backrest -->
      <path d="M350 420 Q330 380 350 350 Q370 320 400 330 Q430 340 450 350 Q470 380 450 420 L450 440 Q430 440 400 430 Q370 420 350 420 Z"
            fill="#1E3A8A" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Armrests -->
      <path d="M350 420 Q320 410 300 420 Q300 440 320 450 Q350 460 350 440" 
            fill="none" stroke="#D4AF37" stroke-width="2"/>
      <path d="M450 420 Q480 410 500 420 Q500 440 480 450 Q450 460 450 440" 
            fill="none" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Gold Inlays on Seat -->
      <path d="M360 430 Q400 420 440 430" 
            fill="none" stroke="#D4AF37" stroke-width="1"/>
      <path d="M370 425 Q400 415 430 425" 
            fill="none" stroke="#D4AF37" stroke-width="1"/>
    </g>
    
    <!-- Columns -->
    <g id="throneColumns">
      <!-- Left Column -->
      <path d="M250 440 L250 200 Q260 180 270 160 Q280 140 290 120 Q300 100 300 80 L300 500" 
            fill="#1E3A8A" stroke="#D4AF37" stroke-width="2"/>
      <path d="M250 440 L250 200" fill="url(#columnFluting)" opacity="0.3"/>
      
      <!-- Right Column -->
      <path d="M500 440 L500 200 Q490 180 480 160 Q470 140 460 120 Q450 100 450 80 L450 500" 
            fill="#1E3A8A" stroke="#D4AF37" stroke-width="2"/>
      <path d="M500 440 L500 200" fill="url(#columnFluting)" opacity="0.3"/>
      
      <!-- Column Capitals -->
      <path d="M240 80 L310 80 L310 60 L240 60 Z" 
            fill="url(#throneGold)" stroke="#B8860B" stroke-width="1"/>
      <path d="M440 80 L510 80 L510 60 L440 60 Z" 
            fill="url(#throneGold)" stroke="#B8860B" stroke-width="1"/>
      
      <!-- Column Bases -->
      <path d="M240 500 L310 500 L310 480 L240 480 Z" 
            fill="url(#throneGold)" stroke="#B8860B" stroke-width="1"/>
      <path d="M440 500 L510 500 L510 480 L440 480 Z" 
            fill="url(#throneGold)" stroke="#B8860B" stroke-width="1"/>
    </g>
    
    <!-- Arch -->
    <g id="throneArch">
      <!-- Arch Curve -->
      <path d="M300 80 Q400 40 500 80" 
            fill="none" stroke="#D4AF37" stroke-width="4"/>
      
      <!-- Arch Details -->
      <path d="M300 80 Q320 70 340 75 Q360 80 380 75 Q400 70 420 75 Q440 80 460 75 Q480 70 500 80" 
            fill="none" stroke="#F4E48C" stroke-width="2"/>
      
      <!-- Arch Medallion -->
      <circle cx="400" cy="50" r="25" fill="#1E3A8A" stroke="#D4AF37" stroke-width="2"/>
      <circle cx="400" cy="50" r="15" fill="url(#throneGold)" stroke="#B8860B" stroke-width="1"/>
      <circle cx="400" cy="50" r="8" fill="#00D4FF"/>
      
      <!-- Arch Side Ornaments -->
      <circle cx="340" cy="70" r="8" fill="url(#throneGold)" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="460" cy="70" r="8" fill="url(#throneGold)" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="340" cy="70" r="3" fill="#00D4FF"/>
      <circle cx="460" cy="70" r="3" fill="#00D4FF"/>
    </g>
    
    <!-- Gold Detailing -->
    <g id="throneDetails">
      <!-- Seat Border -->
      <path d="M350 420 Q400 400 450 420" 
            fill="none" stroke="#D4AF37" stroke-width="1"/>
      
      <!-- Backrest Border -->
      <path d="M350 420 Q330 380 350 350 Q370 320 400 330 Q430 340 450 350 Q470 380 450 420" 
            fill="none" stroke="#D4AF37" stroke-width="1"/>
      
      <!-- Decorative Elements on Columns -->
      <circle cx="275" cy="200" r="5" fill="url(#throneGold)" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="275" cy="300" r="5" fill="url(#throneGold)" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="275" cy="400" r="5" fill="url(#throneGold)" stroke="#B8860B" stroke-width="0.5"/>
      
      <circle cx="475" cy="200" r="5" fill="url(#throneGold)" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="475" cy="300" r="5" fill="url(#throneGold)" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="475" cy="400" r="5" fill="url(#throneGold)" stroke="#B8860B" stroke-width="0.5"/>
      
      <!-- Central Medallion on Platform -->
      <circle cx="400" cy="490" r="15" fill="url(#throneGold)" stroke="#B8860B" stroke-width="1"/>
      <circle cx="400" cy="490" r="8" fill="#1E3A8A"/>
      <circle cx="400" cy="490" r="3" fill="#00D4FF"/>
    </g>
    
    <!-- Volumetric Light Effect -->
    <ellipse cx="400" cy="300" rx="150" ry="50" fill="url(#volumetricLight)" 
             filter="url(#lightGlow)" opacity="0.5"/>
  </g>
  
  <!-- Optional: Regal Sentinel Silhouette on Throne -->
  <g id="throneSentinel" opacity="0.8" transform="translate(350, 350) scale(0.3)">
    <path d="M50 150 Q80 120 120 110 Q160 100 200 110 Q240 120 280 120 Q320 120 350 150 Q360 160 350 170 Q330 180 300 180 Q280 180 260 170 Q240 160 220 160 Q200 160 180 170 Q160 180 140 170 Q120 160 100 170 Q80 180 60 170 Q50 160 50 150 Z"
          fill="#F8F9FA" stroke="none"/>
    <path d="M100 110 Q80 90 70 70 Q80 50 100 40 Q120 30 140 40 Q160 50 180 60 Q200 70 200 90 Q180 100 160 100 Q140 100 120 90 Q100 80 100 110 Z"
          fill="#F8F9FA" stroke="none"/>
    <path d="M120 30 Q130 15 150 15 Q170 15 180 30 Q190 40 180 50 Q160 55 140 55 Q120 50 110 40 Q120 30 Z"
          fill="#F8F9FA" stroke="none"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Celestial Throne - Full Scene</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Monumental symmetrical architecture with antique-gold details, deep teal atmosphere, and central focal point.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

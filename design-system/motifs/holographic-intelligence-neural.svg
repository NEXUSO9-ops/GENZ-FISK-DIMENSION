<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="neuralCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="neuralViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    
    <filter id="neuralSoftGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Neural Web Structure -->
  <g id="neuralWeb">
    
    <!-- Primary Nodes (Cyan) -->
    <g id="primaryNodes">
      <circle cx="200" cy="200" r="6" fill="#00D4FF" filter="url(#neuralSoftGlow)"/>
      <circle cx="100" cy="100" r="5" fill="#00D4FF" filter="url(#neuralSoftGlow)"/>
      <circle cx="300" cy="100" r="5" fill="#00D4FF" filter="url(#neuralSoftGlow)"/>
      <circle cx="100" cy="300" r="5" fill="#00D4FF" filter="url(#neuralSoftGlow)"/>
      <circle cx="300" cy="300" r="5" fill="#00D4FF" filter="url(#neuralSoftGlow)"/>
      <circle cx="200" cy="50" r="4" fill="#00D4FF"/>
      <circle cx="200" cy="350" r="4" fill="#00D4FF"/>
      <circle cx="50" cy="200" r="4" fill="#00D4FF"/>
      <circle cx="350" cy="200" r="4" fill="#00D4FF"/>
    </g>
    
    <!-- Secondary Nodes (Violet) -->
    <g id="secondaryNodes">
      <circle cx="150" cy="150" r="4" fill="#6366F1" opacity="0.9"/>
      <circle cx="250" cy="150" r="4" fill="#6366F1" opacity="0.9"/>
      <circle cx="150" cy="250" r="4" fill="#6366F1" opacity="0.9"/>
      <circle cx="250" cy="250" r="4" fill="#6366F1" opacity="0.9"/>
      <circle cx="100" cy="200" r="3" fill="#6366F1" opacity="0.8"/>
      <circle cx="300" cy="200" r="3" fill="#6366F1" opacity="0.8"/>
      <circle cx="200" cy="100" r="3" fill="#6366F1" opacity="0.8"/>
      <circle cx="200" cy="300" r="3" fill="#6366F1" opacity="0.8"/>
    </g>
    
    <!-- Tertiary Nodes (Cyan at 50% opacity) -->
    <g id="tertiaryNodes">
      <circle cx="125" cy="125" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="175" cy="125" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="225" cy="125" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="275" cy="125" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="125" cy="175" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="275" cy="175" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="125" cy="225" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="175" cy="225" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="225" cy="225" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="275" cy="225" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="125" cy="275" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="175" cy="275" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="225" cy="275" r="2" fill="#00D4FF" opacity="0.7"/>
      <circle cx="275" cy="275" r="2" fill="#00D4FF" opacity="0.7"/>
    </g>
    
    <!-- Primary Connections (Cyan, thick) -->
    <g id="primaryConnections">
      <line x1="200" y1="200" x2="100" y2="100" stroke="#00D4FF" stroke-width="2"/>
      <line x1="200" y1="200" x2="300" y2="100" stroke="#00D4FF" stroke-width="2"/>
      <line x1="200" y1="200" x2="100" y2="300" stroke="#00D4FF" stroke-width="2"/>
      <line x1="200" y1="200" x2="300" y2="300" stroke="#00D4FF" stroke-width="2"/>
      <line x1="200" y1="200" x2="200" y2="50" stroke="#00D4FF" stroke-width="2"/>
      <line x1="200" y1="200" x2="200" y2="350" stroke="#00D4FF" stroke-width="2"/>
      <line x1="200" y1="200" x2="50" y2="200" stroke="#00D4FF" stroke-width="2"/>
      <line x1="200" y1="200" x2="350" y2="200" stroke="#00D4FF" stroke-width="2"/>
    </g>
    
    <!-- Secondary Connections (Violet, medium) -->
    <g id="secondaryConnections">
      <line x1="100" y1="100" x2="150" y2="150" stroke="#6366F1" stroke-width="1.5" opacity="0.9"/>
      <line x1="300" y1="100" x2="250" y2="150" stroke="#6366F1" stroke-width="1.5" opacity="0.9"/>
      <line x1="100" y1="300" x2="150" y2="250" stroke="#6366F1" stroke-width="1.5" opacity="0.9"/>
      <line x1="300" y1="300" x2="250" y2="250" stroke="#6366F1" stroke-width="1.5" opacity="0.9"/>
      <line x1="100" y1="100" x2="100" y2="200" stroke="#6366F1" stroke-width="1.5" opacity="0.8"/>
      <line x1="300" y1="100" x2="300" y2="200" stroke="#6366F1" stroke-width="1.5" opacity="0.8"/>
      <line x1="100" y1="300" x2="100" y2="200" stroke="#6366F1" stroke-width="1.5" opacity="0.8"/>
      <line x1="300" y1="300" x2="300" y2="200" stroke="#6366F1" stroke-width="1.5" opacity="0.8"/>
      <line x1="200" y1="100" x2="200" y2="200" stroke="#6366F1" stroke-width="1.5" opacity="0.8"/>
      <line x1="200" y1="300" x2="200" y2="200" stroke="#6366F1" stroke-width="1.5" opacity="0.8"/>
    </g>
    
    <!-- Tertiary Connections (Cyan, thin) -->
    <g id="tertiaryConnections" opacity="0.6">
      <line x1="150" y1="150" x2="125" y2="125" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="150" y1="150" x2="175" y2="125" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="150" y1="150" x2="125" y2="175" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="150" y1="150" x2="175" y2="175" stroke="#00D4FF" stroke-width="0.5"/>
      
      <line x1="250" y1="150" x2="225" y2="125" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="250" y1="150" x2="275" y2="125" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="250" y1="150" x2="225" y2="175" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="250" y1="150" x2="275" y2="175" stroke="#00D4FF" stroke-width="0.5"/>
      
      <line x1="150" y1="250" x2="125" y2="225" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="150" y1="250" x2="175" y2="225" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="150" y1="250" x2="125" y2="275" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="150" y1="250" x2="175" y2="275" stroke="#00D4FF" stroke-width="0.5"/>
      
      <line x1="250" y1="250" x2="225" y2="225" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="250" y1="250" x2="275" y2="225" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="250" y1="250" x2="225" y2="275" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="250" y1="250" x2="275" y2="275" stroke="#00D4FF" stroke-width="0.5"/>
    </g>
    
    <!-- Hexagonal Structure Overlay -->
    <g id="hexagonalOverlay" opacity="0.2">
      <path d="M150 100 L200 80 L250 100 L250 150 L200 170 L150 150 Z"
            stroke="#00D4FF" stroke-width="0.5" fill="none"/>
      <path d="M150 250 L200 230 L250 250 L250 300 L200 320 L150 300 Z"
            stroke="#00D4FF" stroke-width="0.5" fill="none"/>
      <path d="M100 150 L150 130 L200 150 L200 200 L150 220 L100 200 Z"
            stroke="#00D4FF" stroke-width="0.5" fill="none"/>
      <path d="M250 150 L300 130 L350 150 L350 200 L300 220 L250 200 Z"
            stroke="#00D4FF" stroke-width="0.5" fill="none"/>
    </g>
    
    <!-- Central Core Glow -->
    <radialGradient id="centralGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <circle cx="200" cy="200" r="40" fill="url(#centralGlow)"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Holographic Intelligence - Neural Web</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Subtle neural structures with interconnected nodes.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="columnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F4E48C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <linearGradient id="columnGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E48C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    
    <radialGradient id="columnAtmosphere" cx="50%" cy="0%" r="100%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </radialGradient>
    
    <!-- Column Fluting Pattern -->
    <pattern id="columnFluting" patternUnits="userSpaceOnUse" width="10" height="30">
      <path d="M0 0 L3 15 L6 0 L9 30 L6 15 L3 30 Z" stroke="#B8860B" stroke-width="0.3" fill="none"/>
    </pattern>
    
    <filter id="columnSoftShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="400" fill="url(#columnAtmosphere)"/>
  
  <!-- Celestial Columns Pair -->
  <g id="celestialColumns">
    
    <!-- Left Column -->
    <g id="leftColumn">
      <!-- Column Shaft -->
      <path d="M30 350 L30 50 Q40 30 50 50 L50 350 Z" 
            fill="#1E3A8A" stroke="#D4AF37" stroke-width="2" filter="url(#columnSoftShadow)"/>
      
      <!-- Fluting Overlay -->
      <path d="M30 350 L30 50 Q40 30 50 50 L50 350 Z" 
            fill="url(#columnFluting)" opacity="0.4"/>
      
      <!-- Column Capital -->
      <path d="M25 50 L55 50 L55 30 L25 30 Z" 
            fill="url(#columnGold)" stroke="#B8860B" stroke-width="1"/>
      
      <!-- Capital Detail -->
      <path d="M25 50 Q30 45 35 50" fill="none" stroke="#F4E48C" stroke-width="0.5"/>
      <path d="M45 50 Q50 45 55 50" fill="none" stroke="#F4E48C" stroke-width="0.5"/>
      
      <!-- Column Base -->
      <path d="M25 350 L55 350 L55 370 L25 370 Z" 
            fill="url(#columnGold)" stroke="#B8860B" stroke-width="1"/>
      
      <!-- Base Detail -->
      <path d="M25 350 Q30 355 35 350" fill="none" stroke="#F4E48C" stroke-width="0.5"/>
      <path d="M45 350 Q50 355 55 350" fill="none" stroke="#F4E48C" stroke-width="0.5"/>
      
      <!-- Decorative Bands -->
      <circle cx="40" cy="100" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="40" cy="150" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="40" cy="200" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="40" cy="250" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="40" cy="300" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      
      <!-- Band Highlights -->
      <circle cx="40" cy="100" r="2" fill="#00D4FF"/>
      <circle cx="40" cy="150" r="2" fill="#00D4FF"/>
      <circle cx="40" cy="200" r="2" fill="#00D4FF"/>
      <circle cx="40" cy="250" r="2" fill="#00D4FF"/>
      <circle cx="40" cy="300" r="2" fill="#00D4FF"/>
    </g>
    
    <!-- Right Column -->
    <g id="rightColumn">
      <!-- Column Shaft -->
      <path d="M120 350 L120 50 Q130 30 140 50 L140 350 Z" 
            fill="#1E3A8A" stroke="#D4AF37" stroke-width="2" filter="url(#columnSoftShadow)"/>
      
      <!-- Fluting Overlay -->
      <path d="M120 350 L120 50 Q130 30 140 50 L140 350 Z" 
            fill="url(#columnFluting)" opacity="0.4"/>
      
      <!-- Column Capital -->
      <path d="M115 50 L145 50 L145 30 L115 30 Z" 
            fill="url(#columnGold)" stroke="#B8860B" stroke-width="1"/>
      
      <!-- Capital Detail -->
      <path d="M115 50 Q120 45 125 50" fill="none" stroke="#F4E48C" stroke-width="0.5"/>
      <path d="M135 50 Q140 45 145 50" fill="none" stroke="#F4E48C" stroke-width="0.5"/>
      
      <!-- Column Base -->
      <path d="M115 350 L145 350 L145 370 L115 370 Z" 
            fill="url(#columnGold)" stroke="#B8860B" stroke-width="1"/>
      
      <!-- Base Detail -->
      <path d="M115 350 Q120 355 125 350" fill="none" stroke="#F4E48C" stroke-width="0.5"/>
      <path d="M135 350 Q140 355 145 350" fill="none" stroke="#F4E48C" stroke-width="0.5"/>
      
      <!-- Decorative Bands -->
      <circle cx="130" cy="100" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="130" cy="150" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="130" cy="200" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="130" cy="250" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="130" cy="300" r="5" fill="url(#columnGold)" stroke="#B8860B" stroke-width="0.3"/>
      
      <!-- Band Highlights -->
      <circle cx="130" cy="100" r="2" fill="#00D4FF"/>
      <circle cx="130" cy="150" r="2" fill="#00D4FF"/>
      <circle cx="130" cy="200" r="2" fill="#00D4FF"/>
      <circle cx="130" cy="250" r="2" fill="#00D4FF"/>
      <circle cx="130" cy="300" r="2" fill="#00D4FF"/>
    </g>
    
    <!-- Connecting Arch Hint -->
    <path d="M50 50 Q85 30 115 50" 
          fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Optional: Holographic Accent between columns -->
  <g id="columnHolographic" opacity="0.15" transform="translate(85, 200)">
    <circle cx="0" cy="0" r="30" stroke="#00D4FF" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="0" r="45" stroke="#00D4FF" stroke-width="0.5" fill="none"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#00D4FF" stroke-width="0.3"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#00D4FF" stroke-width="0.3"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Celestial Columns - Pair</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Fluted column pair with gold details from the Celestial Throne.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Animation for pulse effect -->
    <animateTransform
      id="pulseAnimation"
      attributeName="transform"
      type="scale"
      values="1; 1.05; 1"
      dur="3s"
      repeatCount="indefinite"
      additive="sum"
    />
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="300" height="300" fill="transparent"/>
  
  <!-- Signal Rings -->
  <g id="signalRings">
    
    <!-- Outer Ring (Largest) -->
    <circle cx="150" cy="150" r="140" 
            stroke="url(#ringGradient)" 
            stroke-width="1" 
            fill="none" 
            opacity="0.3"
            filter="url(#ringGlow)"/>
    
    <!-- Third Ring -->
    <circle cx="150" cy="150" r="110" 
            stroke="url(#ringGradient)" 
            stroke-width="1.5" 
            fill="none" 
            opacity="0.5"
            filter="url(#ringGlow)"/>
    
    <!-- Second Ring -->
    <circle cx="150" cy="150" r="80" 
            stroke="url(#ringGradient)" 
            stroke-width="2" 
            fill="none" 
            opacity="0.8"/>
    
    <!-- Inner Ring (Smallest) -->
    <circle cx="150" cy="150" r="50" 
            stroke="url(#ringGradient)" 
            stroke-width="2" 
            fill="none"/>
    
    <!-- Central Point -->
    <circle cx="150" cy="150" r="4" fill="#00D4FF"/>
    <circle cx="150" cy="150" r="2" fill="#00FFFF"/>
  </g>
  
  <!-- Data Points on Rings -->
  <g id="dataPoints">
    <!-- Points on outer ring -->
    <circle cx="150" cy="10" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="270" cy="80" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="290" cy="150" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="270" cy="220" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="150" cy="290" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="30" cy="220" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="10" cy="150" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="30" cy="80" r="2" fill="#00D4FF" opacity="0.6"/>
    
    <!-- Points on third ring -->
    <circle cx="150" cy="40" r="1.5" fill="#00D4FF" opacity="0.8"/>
    <circle cx="240" cy="110" r="1.5" fill="#00D4FF" opacity="0.8"/>
    <circle cx="260" cy="150" r="1.5" fill="#00D4FF" opacity="0.8"/>
    <circle cx="240" cy="190" r="1.5" fill="#00D4FF" opacity="0.8"/>
    <circle cx="150" cy="260" r="1.5" fill="#00D4FF" opacity="0.8"/>
    <circle cx="60" cy="190" r="1.5" fill="#00D4FF" opacity="0.8"/>
    <circle cx="40" cy="150" r="1.5" fill="#00D4FF" opacity="0.8"/>
    <circle cx="60" cy="110" r="1.5" fill="#00D4FF" opacity="0.8"/>
    
    <!-- Points on second ring -->
    <circle cx="150" cy="70" r="1" fill="#00D4FF"/>
    <circle cx="210" cy="110" r="1" fill="#00D4FF"/>
    <circle cx="230" cy="150" r="1" fill="#00D4FF"/>
    <circle cx="210" cy="190" r="1" fill="#00D4FF"/>
    <circle cx="150" cy="230" r="1" fill="#00D4FF"/>
    <circle cx="90" cy="190" r="1" fill="#00D4FF"/>
    <circle cx="70" cy="150" r="1" fill="#00D4FF"/>
    <circle cx="90" cy="110" r="1" fill="#00D4FF"/>
    
    <!-- Points on inner ring -->
    <circle cx="150" cy="100" r="0.5" fill="#00D4FF"/>
    <circle cx="190" cy="130" r="0.5" fill="#00D4FF"/>
    <circle cx="150" cy="160" r="0.5" fill="#00D4FF"/>
    <circle cx="110" cy="130" r="0.5" fill="#00D4FF"/>
  </g>
  
  <!-- Connecting Lines (Optional) -->
  <g id="connectingLines" opacity="0.3">
    <line x1="150" y1="10" x2="150" y2="40" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="270" y1="80" x2="240" y2="110" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="290" y1="150" x2="260" y2="150" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="270" y1="220" x2="240" y2="190" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="150" y1="290" x2="150" y2="260" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="30" y1="220" x2="60" y2="190" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="10" y1="150" x2="40" y2="150" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="30" y1="80" x2="60" y2="110" stroke="#00D4FF" stroke-width="0.5"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Holographic Intelligence - Signal Rings</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Concentric audio-signal rings for functional controls and status indicators.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

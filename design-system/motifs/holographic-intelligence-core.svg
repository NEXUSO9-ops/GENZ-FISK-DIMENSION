<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Color Definitions -->
    <radialGradient id="holoCoreGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="holoVioletGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="holoCyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    
    <filter id="holoSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="holoSharpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Neural pattern -->
    <pattern id="neuralPattern" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" stroke="#00D4FF" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M20 20 L0 40 L20 20 L40 0 L20 20 Z" stroke="#6366F1" stroke-width="0.3" fill="none" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Holographic Intelligence Core -->
  <g id="holographicIntelligence">
    
    <!-- Outer Glow (Cyan) -->
    <circle cx="200" cy="200" r="180" fill="url(#holoCoreGlow)" opacity="0.3" 
            filter="url(#holoSoftGlow)"/>
    
    <!-- Inner Glow (Violet) -->
    <circle cx="200" cy="200" r="120" fill="url(#holoVioletGlow)" opacity="0.2" 
            filter="url(#holoSoftGlow)"/>
    
    <!-- Core Sphere -->
    <circle cx="200" cy="200" r="60" fill="url(#holoCyanViolet)" opacity="0.1" 
            stroke="#00D4FF" stroke-width="1"/>
    
    <!-- Signal Rings (Concentric Audio-Signal Rings) -->
    <g id="signalRings">
      <circle cx="200" cy="200" r="80" stroke="#00D4FF" stroke-width="1" fill="none"/>
      <circle cx="200" cy="200" r="120" stroke="#00D4FF" stroke-width="1" fill="none" opacity="0.8"/>
      <circle cx="200" cy="200" r="160" stroke="#00D4FF" stroke-width="1" fill="none" opacity="0.6"/>
      <circle cx="200" cy="200" r="200" stroke="#00D4FF" stroke-width="1" fill="none" opacity="0.4"/>
    </g>
    
    <!-- Neural Structure -->
    <g id="neuralStructure">
      <!-- Hexagonal Core -->
      <path d="M170 170 L200 140 L230 170 L230 200 L200 230 L170 200 Z"
            stroke="#00D4FF" stroke-width="1" fill="none"/>
      <path d="M170 170 L140 200 L170 230 L200 230 L230 200 L200 170 Z"
            stroke="#00D4FF" stroke-width="1" fill="none" opacity="0.8"/>
      
      <!-- Neural Nodes -->
      <circle cx="170" cy="170" r="3" fill="#00D4FF"/>
      <circle cx="200" cy="140" r="3" fill="#00D4FF"/>
      <circle cx="230" cy="170" r="3" fill="#00D4FF"/>
      <circle cx="230" cy="200" r="3" fill="#00D4FF"/>
      <circle cx="200" cy="230" r="3" fill="#00D4FF"/>
      <circle cx="170" cy="200" r="3" fill="#00D4FF"/>
      <circle cx="140" cy="200" r="3" fill="#6366F1"/>
      <circle cx="170" cy="230" r="3" fill="#6366F1"/>
      <circle cx="200" cy="200" r="4" fill="#00D4FF"/>
      
      <!-- Neural Connections -->
      <line x1="170" y1="170" x2="200" y2="140" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="200" y1="140" x2="230" y2="170" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="230" y1="170" x2="230" y2="200" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="230" y1="200" x2="200" y2="230" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="200" y1="230" x2="170" y2="200" stroke="#00D4FF" stroke-width="0.5"/>
      <line x1="170" y1="200" x2="140" y2="200" stroke="#6366F1" stroke-width="0.5" opacity="0.8"/>
      <line x1="170" y1="200" x2="170" y2="230" stroke="#6366F1" stroke-width="0.5" opacity="0.8"/>
      <line x1="200" y1="200" x2="170" y2="170" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
      <line x1="200" y1="200" x2="230" y2="170" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
      <line x1="200" y1="200" x2="230" y2="200" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
      <line x1="200" y1="200" x2="200" y2="230" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
      <line x1="200" y1="200" x2="170" y2="200" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
    </g>
    
    <!-- Data Flow Lines (Subtle) -->
    <g id="dataFlow" opacity="0.4">
      <path d="M100 100 Q150 80 200 100 Q250 120 300 100" stroke="#00D4FF" stroke-width="0.3" fill="none"/>
      <path d="M100 300 Q150 280 200 300 Q250 320 300 300" stroke="#00D4FF" stroke-width="0.3" fill="none"/>
      <path d="M100 200 Q150 180 200 200 Q250 220 300 200" stroke="#6366F1" stroke-width="0.3" fill="none"/>
    </g>
    
    <!-- Central Core Point -->
    <circle cx="200" cy="200" r="8" fill="#00D4FF" stroke="#0099CC" stroke-width="2"/>
    <circle cx="200" cy="200" r="4" fill="#00FFFF" opacity="0.8"/>
    
    <!-- Scan Lines (Radial) -->
    <g id="scanLines" opacity="0.2">
      <line x1="200" y1="200" x2="200" y2="50" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="200" y1="200" x2="270" y2="70" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="200" y1="200" x2="350" y2="200" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="200" y1="200" x2="270" y2="330" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="200" y1="200" x2="200" y2="350" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="200" y1="200" x2="130" y2="330" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="200" y1="200" x2="50" y2="200" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="200" y1="200" x2="130" y2="70" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="2,2"/>
    </g>
  </g>
  
  <!-- Optional: Background neural pattern -->
  <rect x="50" y="50" width="300" height="300" fill="url(#neuralPattern)" opacity="0.1"/>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Holographic Intelligence - Core</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Luminous abstract intelligence presence with neural structures and concentric audio-signal rings.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

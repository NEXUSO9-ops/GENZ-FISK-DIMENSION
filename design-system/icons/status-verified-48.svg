<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="verifiedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <filter id="verifiedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Verified Status: Circle with Checkmark (48px) -->
  <g id="statusVerified">
    <!-- Outer Circle with glow -->
    <circle cx="24" cy="24" r="20" 
            fill="none" 
            stroke="#00D4FF" 
            stroke-width="3" 
            filter="url(#verifiedGlow)"/>
    
    <!-- Inner Circle (subtle fill) -->
    <circle cx="24" cy="24" r="20" 
            fill="url(#verifiedGradient)" 
            opacity="0.1"/>
    
    <!-- Checkmark (scaled) -->
    <path d="M14 24 L18 29 L26 19" 
          fill="none" 
          stroke="#00D4FF" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Status - Verified (48px)</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Verified state indicator: Circle with checkmark. Color: Cyan (#00D4FF).
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

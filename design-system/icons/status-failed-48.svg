<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="failedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#591F0A"/>
    </linearGradient>
    
    <filter id="failedGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Failed Status: Circle with X (48px) -->
  <g id="statusFailed">
    <!-- Outer Circle with glow -->
    <circle cx="24" cy="24" r="20" 
            fill="none" 
            stroke="#7C2D12" 
            stroke-width="3" 
            filter="url(#failedGlow)"/>
    
    <!-- Inner Circle (subtle fill) -->
    <circle cx="24" cy="24" r="20" 
            fill="url(#failedGradient)" 
            opacity="0.1"/>
    
    <!-- X Mark -->
    <path d="M16 16 L32 32" 
          fill="none" 
          stroke="#7C2D12" 
          stroke-width="4" 
          stroke-linecap="round"/>
    <path d="M32 16 L16 32" 
          fill="none" 
          stroke="#7C2D12" 
          stroke-width="4" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Status - Failed (48px)</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Failed state indicator: Circle with X. Color: Deep Red (#7C2D12).
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

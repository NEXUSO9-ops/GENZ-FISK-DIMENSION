<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="reportedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  
  <!-- Reported Status: Triangle (point up) -->
  <g id="statusReported">
    <!-- Triangle -->
    <path d="M12 4 L18 18 L6 18 Z" 
          fill="url(#reportedGradient)" 
          stroke="#6366F1" 
          stroke-width="2" 
          opacity="0.9"/>
    
    <!-- Inner Triangle (subtle) -->
    <path d="M12 7 L15 15 L9 15 Z" 
          fill="none" 
          stroke="#6366F1" 
          stroke-width="1" 
          opacity="0.5"/>
    
    <!-- Exclamation Mark (optional for emphasis) -->
    <path d="M12 12 L12 15" 
          fill="none" 
          stroke="#F8F9FA" 
          stroke-width="2"/>
    <circle cx="12" cy="17" r="1" fill="#F8F9FA"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Status - Reported (24px)</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Reported state indicator: Triangle pointing up. Color: Violet (#6366F1).
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="blockedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>
  
  <!-- Blocked Status: Square with Slash (32px) -->
  <g id="statusBlocked">
    <!-- Square -->
    <rect x="8" y="8" width="16" height="16" 
          fill="url(#blockedGradient)" 
          stroke="#EF4444" 
          stroke-width="2" 
          opacity="0.9"/>
    
    <!-- Slash -->
    <path d="M10 10 L22 22" 
          fill="none" 
          stroke="#F8F9FA" 
          stroke-width="2.5" 
          stroke-linecap="round"/>
    
    <!-- Inner Square -->
    <rect x="9" y="9" width="14" height="14" 
          fill="none" 
          stroke="#EF4444" 
          stroke-width="0.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Status - Blocked (32px)</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Blocked state indicator: Square with slash. Color: Red (#EF4444).
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

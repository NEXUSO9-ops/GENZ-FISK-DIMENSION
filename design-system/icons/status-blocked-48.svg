<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="blockedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    
    <filter id="blockedGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Blocked Status: Square with Slash (48px) -->
  <g id="statusBlocked">
    <!-- Square with glow -->
    <rect x="12" y="12" width="24" height="24" 
          fill="url(#blockedGradient)" 
          stroke="#EF4444" 
          stroke-width="3" 
          opacity="0.9" 
          filter="url(#blockedGlow)"/>
    
    <!-- Slash -->
    <path d="M14 14 L34 34" 
          fill="none" 
          stroke="#F8F9FA" 
          stroke-width="4" 
          stroke-linecap="round"/>
    
    <!-- Inner Square -->
    <rect x="13" y="13" width="22" height="22" 
          fill="none" 
          stroke="#EF4444" 
          stroke-width="1" 
          opacity="0.5"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Status - Blocked (48px)</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Blocked state indicator: Square with slash. Color: Red (#EF4444).
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="pendingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- Pending Status: Hourglass -->
  <g id="statusPending">
    <!-- Hourglass Outline -->
    <path d="M10 4 L14 4 L14 8 L10 8 Z" 
          fill="none" 
          stroke="#D4AF37" 
          stroke-width="2"/>
    <path d="M10 20 L14 20 L14 16 L10 16 Z" 
          fill="none" 
          stroke="#D4AF37" 
          stroke-width="2"/>
    <path d="M8 8 L16 8" stroke="#D4AF37" stroke-width="2"/>
    <path d="M8 16 L16 16" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- Sand (Top) -->
    <rect x="9" y="5" width="6" height="2" fill="#D4AF37" opacity="0.8"/>
    <rect x="9" y="6" width="6" height="1" fill="#D4AF37" opacity="0.6"/>
    
    <!-- Sand (Bottom) -->
    <rect x="9" y="17" width="6" height="2" fill="#D4AF37" opacity="0.8"/>
    <rect x="9" y="18" width="6" height="1" fill="#D4AF37" opacity="0.6"/>
    
    <!-- Hourglass Frame -->
    <path d="M10 4 Q8 4 8 8" stroke="#D4AF37" stroke-width="1"/>
    <path d="M14 4 Q16 4 16 8" stroke="#D4AF37" stroke-width="1"/>
    <path d="M10 20 Q8 20 8 16" stroke="#D4AF37" stroke-width="1"/>
    <path d="M14 20 Q16 20 16 16" stroke="#D4AF37" stroke-width="1"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">

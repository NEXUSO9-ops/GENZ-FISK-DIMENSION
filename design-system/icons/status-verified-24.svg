<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="verifiedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
  </defs>
  
  <!-- Verified Status: Circle with Checkmark -->
  <g id="statusVerified">
    <!-- Outer Circle -->
    <circle cx="12" cy="12" r="10" 
            fill="none" 
            stroke="#00D4FF" 
            stroke-width="2"/>
    
    <!-- Inner Circle (subtle fill) -->
    <circle cx="12" cy="12" r="10" 
            fill="url(#verifiedGradient)" 
            opacity="0.1"/>
    
    <!-- Checkmark -->
    <path d="M8 12 L11 15 L16 10" 
          fill="none" 
          stroke="#00D4FF" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Status - Verified (24px)</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Verified state indicator: Circle with checkmark. Color: Cyan (#00D4FF).
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

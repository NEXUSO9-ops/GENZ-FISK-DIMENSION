<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="gateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="verifiedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="blockedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    
    <!-- Filter for glow -->
    <filter id="gateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Background Pattern -->
    <pattern id="riskGrid" patternUnits="userSpaceOnUse" width="30" height="30">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.05"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0A0A0F"/>
  <rect width="800" height="600" fill="url(#riskGrid)"/>
  
  <!-- Diagram Title -->
  <g id="diagramTitle">
    <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#00D4FF">
      RISK GATES
    </text>
    <text x="400" y="50" text-anchor="middle" font-size="14" fill="#6366F1">
      Fisk Dimension × Omega-9
    </text>
  </g>
  
  <!-- Main Diagram -->
  <g id="riskGatesDiagram" transform="translate(400, 100)">
    
    <!-- Flow Path -->
    <g id="flowPath">
      <!-- Main Horizontal Path -->
      <line x1="-300" y1="0" x2="300" y2="0" stroke="#00D4FF" stroke-width="3" 
            stroke-dasharray="5,2"/>
      
      <!-- Path Arrow -->
      <path d="M280 0 L300 0 L280 -10 Z" fill="#00D4FF" opacity="0.8"/>
      <path d="M280 0 L300 0 L280 -10 Z" fill="none" stroke="#00D4FF" stroke-width="1"/>
      
      <!-- Path Label -->
      <text x="0" y="-40" text-anchor="middle" font-size="12" font-weight="bold" fill="#00D4FF">
        COMMAND FLOW
      </text>
    </g>
    
    <!-- Gate 1: Entry Gate -->
    <g id="gate1" transform="translate(-200, 0)">
      <!-- Gate Structure -->
      <rect x="-20" y="-40" width="40" height="80" rx="4" fill="url(#gateGradient)" 
            stroke="#D4AF37" stroke-width="2" filter="url(#gateGlow)"/>
      
      <!-- Gate Bars -->
      <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="30" x2="15" y2="30" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Gate Label -->
      <text x="0" y="-50" text-anchor="middle" font-size="10" font-weight="bold" fill="#D4AF37">
        ENTRY GATE
      </text>
      
      <!-- Gate Status: Verified -->
      <circle cx="0" cy="50" r="10" fill="url(#verifiedGradient)"/>
      <path d="M-4 47 L0 50 L4 43" fill="none" stroke="#0A0A0F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="62" text-anchor="middle" font-size="8" fill="#00D4FF">OPEN</text>
      
      <!-- Gate Icon: Shield -->
      <path d="M-8 -20 Q-12 0 -8 20 Q0 30 8 20 Q12 0 8 -20 Q0 -30 -8 -20 Z" 
            fill="none" stroke="#D4AF37" stroke-width="1"/>
      <line x1="-5" y1="-15" x2="5" y2="-15" stroke="#D4AF37" stroke-width="1"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#D4AF37" stroke-width="1"/>
    </g>
    
    <!-- Gate 2: Authentication Gate -->
    <g id="gate2" transform="translate(-50, 0)">
      <!-- Gate Structure -->
      <rect x="-20" y="-40" width="40" height="80" rx="4" fill="url(#gateGradient)" 
            stroke="#D4AF37" stroke-width="2" filter="url(#gateGlow)"/>
      
      <!-- Gate Bars -->
      <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="30" x2="15" y2="30" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Gate Label -->
      <text x="0" y="-50" text-anchor="middle" font-size="10" font-weight="bold" fill="#D4AF37">
        AUTH GATE
      </text>
      
      <!-- Gate Status: Verified -->
      <circle cx="0" cy="50" r="10" fill="url(#verifiedGradient)"/>
      <path d="M-4 47 L0 50 L4 43" fill="none" stroke="#0A0A0F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="62" text-anchor="middle" font-size="8" fill="#00D4FF">OPEN</text>
      
      <!-- Gate Icon: Key -->
      <path d="M0 -15 L0 -5" stroke="#D4AF37" stroke-width="2"/>
      <circle cx="0" cy="-5" r="5" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <path d="M0 -5 L5 -2 L5 2 L0 5" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    </g>
    
    <!-- Gate 3: Risk Assessment Gate -->
    <g id="gate3" transform="translate(100, 0)">
      <!-- Gate Structure -->
      <rect x="-20" y="-40" width="40" height="80" rx="4" fill="url(#gateGradient)" 
            stroke="#D4AF37" stroke-width="2" filter="url(#gateGlow)"/>
      
      <!-- Gate Bars -->
      <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="30" x2="15" y2="30" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Gate Label -->
      <text x="0" y="-50" text-anchor="middle" font-size="10" font-weight="bold" fill="#D4AF37">
        RISK GATE
      </text>
      
      <!-- Gate Status: Pending -->
      <circle cx="0" cy="50" r="10" fill="#D4AF37"/>
      <text x="0" y="62" text-anchor="middle" font-size="8" fill="#D4AF37">SCANNING</text>
      
      <!-- Gate Icon: Warning -->
      <path d="M0 -15 L0 15" stroke="#D4AF37" stroke-width="2"/>
      <path d="M0 15 L-4 5 L4 5 Z" fill="#D4AF37" opacity="0.8"/>
      <circle cx="0" cy="5" r="1" fill="#D4AF37"/>
      
      <!-- Scan Lines -->
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
      <line x1="-20" y1="20" x2="20" y2="-20" stroke="#00D4FF" stroke-width="0.5" opacity="0.5"/>
    </g>
    
    <!-- Gate 4: Policy Gate -->
    <g id="gate4" transform="translate(200, 0)">
      <!-- Gate Structure -->
      <rect x="-20" y="-40" width="40" height="80" rx="4" fill="url(#gateGradient)" 
            stroke="#D4AF37" stroke-width="2" filter="url(#gateGlow)"/>
      
      <!-- Gate Bars -->
      <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-15" y1="30" x2="15" y2="30" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Gate Label -->
      <text x="0" y="-50" text-anchor="middle" font-size="10" font-weight="bold" fill="#D4AF37">
        POLICY GATE
      </text>
      
      <!-- Gate Status: Blocked -->
      <circle cx="0" cy="50" r="10" fill="url(#blockedGradient)"/>
      <line x1="-6" y1="45" x2="6" y2="55" stroke="#F8F9FA" stroke-width="2"/>
      <line x1="-6" y1="55" x2="6" y2="45" stroke="#F8F9FA" stroke-width="2"/>
      <text x="0" y="62" text-anchor="middle" font-size="8" fill="#EF4444">CLOSED</text>
      
      <!-- Gate Icon: Lock -->
      <rect x="-5" y="-10" width="10" height="20" rx="2" fill="none" stroke="#EF4444" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#EF4444"/>
    </g>
    
    <!-- Blocked Path (Diverted) -->
    <g id="blockedPath">
      <line x1="220" y1="0" x2="220" y2="-100" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,2"/>
      <line x1="220" y1="-100" x2="300" y2="-100" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,2"/>
      
      <!-- Blocked Label -->
      <text x="260" y="-115" text-anchor="middle" font-size="10" fill="#EF4444">
        DENIED
      </text>
      
      <!-- Blocked Entity -->
      <circle cx="300" cy="-100" r="15" fill="#1E3A8A" stroke="#EF4444" stroke-width="2"/>
      <text x="300" cy="-100" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
        X
      </text>
    </g>
    
    <!-- Alternative Path (Bypass) -->
    <g id="bypassPath">
      <line x1="-200" y1="-80" x2="300" y2="-80" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4,2"/>
      <line x1="300" y1="-80" x2="300" y2="0" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4,2"/>
      
      <!-- Bypass Label -->
      <text x="0" y="-95" text-anchor="middle" font-size="10" fill="#6366F1">
        ADMIN BYPASS
      </text>
      
      <!-- Arrow -->
      <path d="M285 -80 L300 -80 L285 -70 Z" fill="#6366F1" opacity="0.8"/>
      <path d="M285 -80 L300 -80 L285 -70 Z" fill="none" stroke="#6366F1" stroke-width="0.5"/>
    </g>
    
    <!-- Flow Entities -->
    
    <!-- Entity 1: Input -->
    <g id="entity1" transform="translate(-350, 0)">
      <circle cx="0" cy="0" r="20" fill="#0F172A" stroke="#00D4FF" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="9" font-weight="bold" fill="#00D4FF">
        INPUT
      </text>
      <text x="0" y="-15" text-anchor="middle" font-size="7" fill="#00D4FF">
        Command
      </text>
    </g>
    
    <!-- Entity 2: Processed -->
    <g id="entity2" transform="translate(-125, 0)">
      <circle cx="0" cy="0" r="20" fill="#0F172A" stroke="#00D4FF" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="9" font-weight="bold" fill="#00D4FF">
        PROCESSED
      </text>
      <text x="0" y="-15" text-anchor="middle" font-size="7" fill="#00D4FF">
        Data
      </text>
    </g>
    
    <!-- Entity 3: Validated -->
    <g id="entity3" transform="translate(50, 0)">
      <circle cx="0" cy="0" r="20" fill="#0F172A" stroke="#00D4FF" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="9" font-weight="bold" fill="#00D4FF">
        VALIDATED
      </text>
      <text x="0" y="-15" text-anchor="middle" font-size="7" fill="#00D4FF">
        Info
      </text>
    </g>
    
    <!-- Entity 4: Output -->
    <g id="entity4" transform="translate(350, 0)">
      <circle cx="0" cy="0" r="20" fill="#0F172A" stroke="#00D4FF" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="9" font-weight="bold" fill="#00D4FF">
        OUTPUT
      </text>
      <text x="0" y="-15" text-anchor="middle" font-size="7" fill="#00D4FF">
        Result
      </text>
    </g>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 550)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#00D4FF">LEGEND:</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="-10" width="20" height="20" rx="2" fill="url(#gateGradient)" stroke="#D4AF37" stroke-width="1"/>
      <line x1="2" y1="-8" x2="18" y2="-8" stroke="#D4AF37" stroke-width="1"/>
      <line x1="2" y1="-4" x2="18" y2="-4" stroke="#D4AF37" stroke-width="1"/>
      <line x1="2" y1="0" x2="18" y2="0" stroke="#D4AF37" stroke-width="1"/>
      <line x1="2" y1="4" x2="18" y2="4" stroke="#D4AF37" stroke-width="1"/>
      <text x="25" y="5" font-size="10" fill="#F8F9FA">Risk Gate</text>
    </g>
    
    <g transform="translate(0, 50)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#00D4FF" stroke-width="2" stroke-dasharray="3,1"/>
      <text x="50" y="5" font-size="10" fill="#00D4FF">Flow Path</text>
    </g>
    
    <g transform="translate(0, 80)">
      <circle cx="10" cy="0" r="8" fill="#0F172A" stroke="#00D4FF" stroke-width="1.5"/>
      <text x="25" y="5" font-size="10" fill="#F8F9FA">Flow Entity</text>
    </g>
    
    <g transform="translate(250, 20)">
      <circle cx="10" cy="0" r="8" fill="url(#verifiedGradient)"/>
      <path d="M7 0 L9 -3 L13 1" fill="none" stroke="#0A0A0F" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="5" font-size="8" fill="#0A0A0F">OPEN</text>
    </g>
    
    <g transform="translate(250, 50)">
      <circle cx="10" cy="0" r="8" fill="#D4AF37"/>
      <text x="25" y="5" font-size="8" fill="#D4AF37">SCANNING</text>
    </g>
    
    <g transform="translate(250, 80)">
      <circle cx="10" cy="0" r="8" fill="url(#blockedGradient)"/>
      <line x1="6" y1="-2" x2="14" y2="2" stroke="#F8F9FA" stroke-width="1"/>
      <line x1="6" y1="2" x2="14" y2="-2" stroke="#F8F9FA" stroke-width="1"/>
      <text x="25" y="5" font-size="8" fill="#EF4444">CLOSED</text>
    </g>
    
    <g transform="translate(450, 20)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2,1"/>
      <text x="50" y="5" font-size="8" fill="#EF4444">DENIED PATH</text>
    </g>
    
    <g transform="translate(450, 50)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="3,1"/>
      <text x="50" y="5" font-size="8" fill="#6366F1">BYPASS PATH</text>
    </g>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Governance Diagram - Risk Gates</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Template for risk gate diagrams with gate structures, flow paths, status indicators, and bypass routes.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

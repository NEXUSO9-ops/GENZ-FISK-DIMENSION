<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    
    <linearGradient id="nodeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <!-- Status Colors -->
    <linearGradient id="statusVerified" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="statusReported" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    
    <linearGradient id="statusPending" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <linearGradient id="statusBlocked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    
    <linearGradient id="statusFailed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#591F0A"/>
    </linearGradient>
    
    <!-- Filter for glow -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Background Pattern -->
    <pattern id="diagramGrid" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0A0A0F"/>
  <rect width="800" height="600" fill="url(#diagramGrid)"/>
  
  <!-- Diagram Title -->
  <g id="diagramTitle">
    <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#00D4FF">
      COMMAND HIERARCHY
    </text>
    <text x="400" y="50" text-anchor="middle" font-size="14" fill="#6366F1">
      Fisk Dimension × Omega-9
    </text>
  </g>
  
  <!-- Hierarchy Tree -->
  <g id="hierarchyTree" transform="translate(400, 100)">
    
    <!-- Level 1: Sovereign (Root) -->
    <g id="level1">
      <!-- Node -->
      <circle cx="0" cy="0" r="40" fill="url(#nodeGradient)" stroke="#D4AF37" stroke-width="3" 
              filter="url(#nodeGlow)"/>
      <circle cx="0" cy="0" r="30" fill="url(#nodeHighlight)" opacity="0.8"/>
      
      <!-- Icon: Crown -->
      <path d="M-15 -40 L-5 -50 L5 -50 L15 -40 Q20 -35 15 -30 L5 -30 L-5 -30 L-15 -30 Q-20 -35 -15 -40 Z" 
            fill="#D4AF37" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="0" cy="-35" r="3" fill="#1E3A8A"/>
      <circle cx="0" cy="-35" r="1" fill="#00D4FF"/>
      
      <!-- Label -->
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#F8F9FA">
        KING NEXUS
      </text>
      <text x="0" y="20" text-anchor="middle" font-size="10" fill="#00D4FF">
        Sovereign Authority
      </text>
      
      <!-- Status Badge -->
      <rect x="-18" y="35" width="36" height="16" rx="4" fill="#00D4FF" opacity="0.2"/>
      <text x="0" y="43" text-anchor="middle" font-size="8" fill="#00D4FF">VERIFIED</text>
    </g>
    
    <!-- Level 2: Command Centers -->
    <g id="level2">
      <!-- Left Command Center -->
      <g transform="translate(-200, 100)">
        <circle cx="0" cy="0" r="30" fill="url(#nodeGradient)" stroke="#00D4FF" stroke-width="2"/>
        
        <!-- Icon: Shield -->
        <path d="M-12 -8 Q-18 0 -12 8 Q0 16 12 8 Q18 0 12 -8 Q0 -16 -12 -8 Z" 
              fill="none" stroke="#00D4FF" stroke-width="1.5"/>
        <line x1="-6" y1="-4" x2="6" y2="-4" stroke="#00D4FF" stroke-width="1.5"/>
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#00D4FF" stroke-width="1.5"/>
        
        <!-- Label -->
        <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#F8F9FA">
          COMMAND
        </text>
        <text x="0" y="18" text-anchor="middle" font-size="8" fill="#00D4FF">
          Security
        </text>
        
        <!-- Status Badge -->
        <rect x="-24" y="28" width="48" height="14" rx="4" fill="#00D4FF" opacity="0.2"/>
        <text x="0" y="36" text-anchor="middle" font-size="7" fill="#00D4FF">VERIFIED</text>
      </g>
      
      <!-- Right Command Center -->
      <g transform="translate(200, 100)">
        <circle cx="0" cy="0" r="30" fill="url(#nodeGradient)" stroke="#00D4FF" stroke-width="2"/>
        
        <!-- Icon: Sword -->
        <path d="M0 -15 L0 15" stroke="#00D4FF" stroke-width="2"/>
        <path d="M-8 -10 L8 -10 L8 -5 Q10 -3 8 -1 Q6 1 8 3 L8 10" 
              fill="none" stroke="#00D4FF" stroke-width="1.5"/>
        <path d="M-8 -10 L-8 -5 Q-10 -3 -8 -1 Q-6 1 -8 3 L-8 10" 
              fill="none" stroke="#00D4FF" stroke-width="1.5"/>
        
        <!-- Label -->
        <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#F8F9FA">
          COMMAND
        </text>
        <text x="0" y="18" text-anchor="middle" font-size="8" fill="#00D4FF">
          Execution
        </text>
        
        <!-- Status Badge -->
        <rect x="-24" y="28" width="48" height="14" rx="4" fill="#00D4FF" opacity="0.2"/>
        <text x="0" y="36" text-anchor="middle" font-size="7" fill="#00D4FF">VERIFIED</text>
      </g>
    </g>
    
    <!-- Level 3: Sub-commands -->
    <g id="level3">
      <!-- Security Sub-commands -->
      <g transform="translate(-300, 200)">
        <circle cx="0" cy="0" r="22" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1.5"/>
        
        <!-- Icon: Eye -->
        <circle cx="0" cy="0" r="6" fill="none" stroke="#6366F1" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="3" fill="#6366F1"/>
        
        <!-- Label -->
        <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#F8F9FA">
          SCAN
        </text>
        
        <!-- Status Badge -->
        <rect x="-20" y="18" width="40" height="12" rx="3" fill="#6366F1" opacity="0.2"/>
        <text x="0" y="25" text-anchor="middle" font-size="6" fill="#6366F1">REPORTED</text>
      </g>
      
      <g transform="translate(-200, 200)">
        <circle cx="0" cy="0" r="22" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1.5"/>
        
        <!-- Icon: Lock -->
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="none" stroke="#6366F1" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="3" fill="#6366F1"/>
        
        <!-- Label -->
        <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#F8F9FA">
          GUARD
        </text>
        
        <!-- Status Badge -->
        <rect x="-20" y="18" width="40" height="12" rx="3" fill="#00D4FF" opacity="0.2"/>
        <text x="0" y="25" text-anchor="middle" font-size="6" fill="#00D4FF">VERIFIED</text>
      </g>
      
      <!-- Execution Sub-commands -->
      <g transform="translate(200, 200)">
        <circle cx="0" cy="0" r="22" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1.5"/>
        
        <!-- Icon: Bolt -->
        <path d="M0 -10 L0 10" stroke="#6366F1" stroke-width="2"/>
        <path d="M-4 -4 L4 4" stroke="#6366F1" stroke-width="1.5"/>
        <path d="M-4 4 L4 -4" stroke="#6366F1" stroke-width="1.5"/>
        
        <!-- Label -->
        <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#F8F9FA">
          STRIKE
        </text>
        
        <!-- Status Badge -->
        <rect x="-20" y="18" width="40" height="12" rx="3" fill="#D4AF37" opacity="0.2"/>
        <text x="0" y="25" text-anchor="middle" font-size="6" fill="#D4AF37">PENDING</text>
      </g>
      
      <g transform="translate(300, 200)">
        <circle cx="0" cy="0" r="22" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1.5"/>
        
        <!-- Icon: Target -->
        <circle cx="0" cy="0" r="8" fill="none" stroke="#6366F1" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="4" fill="none" stroke="#6366F1" stroke-width="1"/>
        <circle cx="0" cy="0" r="2" fill="#6366F1"/>
        
        <!-- Label -->
        <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#F8F9FA">
          TARGET
        </text>
        
        <!-- Status Badge -->
        <rect x="-20" y="18" width="40" height="12" rx="3" fill="#00D4FF" opacity="0.2"/>
        <text x="0" y="25" text-anchor="middle" font-size="6" fill="#00D4FF">VERIFIED</text>
      </g>
    </g>
    
    <!-- Level 4: Operations -->
    <g id="level4">
      <g transform="translate(-350, 300)">
        <circle cx="0" cy="0" r="18" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
          SCAN-01
        </text>
        <rect x="-18" y="12" width="36" height="10" rx="2" fill="#00D4FF" opacity="0.2"/>
        <text x="0" y="18" text-anchor="middle" font-size="5" fill="#00D4FF">VERIFIED</text>
      </g>
      
      <g transform="translate(-250, 300)">
        <circle cx="0" cy="0" r="18" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
          SCAN-02
        </text>
        <rect x="-18" y="12" width="36" height="10" rx="2" fill="#EF4444" opacity="0.2"/>
        <text x="0" y="18" text-anchor="middle" font-size="5" fill="#EF4444">BLOCKED</text>
      </g>
      
      <g transform="translate(-150, 300)">
        <circle cx="0" cy="0" r="18" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
          GUARD-01
        </text>
        <rect x="-18" y="12" width="36" height="10" rx="2" fill="#00D4FF" opacity="0.2"/>
        <text x="0" y="18" text-anchor="middle" font-size="5" fill="#00D4FF">VERIFIED</text>
      </g>
      
      <g transform="translate(150, 300)">
        <circle cx="0" cy="0" r="18" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
          STRIKE-01
        </text>
        <rect x="-18" y="12" width="36" height="10" rx="2" fill="#D4AF37" opacity="0.2"/>
        <text x="0" y="18" text-anchor="middle" font-size="5" fill="#D4AF37">PENDING</text>
      </g>
      
      <g transform="translate(250, 300)">
        <circle cx="0" cy="0" r="18" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
          TARGET-01
        </text>
        <rect x="-18" y="12" width="36" height="10" rx="2" fill="#00D4FF" opacity="0.2"/>
        <text x="0" y="18" text-anchor="middle" font-size="5" fill="#00D4FF">VERIFIED</text>
      </g>
      
      <g transform="translate(350, 300)">
        <circle cx="0" cy="0" r="18" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
          TARGET-02
        </text>
        <rect x="-18" y="12" width="36" height="10" rx="2" fill="#6366F1" opacity="0.2"/>
        <text x="0" y="18" text-anchor="middle" font-size="5" fill="#6366F1">REPORTED</text>
      </g>
    </g>
    
    <!-- Connectors -->
    <g id="connectors">
      <!-- Level 1 to Level 2 -->
      <line x1="0" y1="40" x2="-200" y2="90" stroke="#00D4FF" stroke-width="1"/>
      <line x1="0" y1="40" x2="200" y2="90" stroke="#00D4FF" stroke-width="1"/>
      
      <!-- Level 2 to Level 3 -->
      <line x1="-200" y1="130" x2="-300" y2="190" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="-200" y1="130" x2="-200" y2="190" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="200" y1="130" x2="200" y2="190" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="200" y1="130" x2="300" y2="190" stroke="#00D4FF" stroke-width="0.8"/>
      
      <!-- Level 3 to Level 4 -->
      <line x1="-300" y1="222" x2="-350" y2="290" stroke="#6366F1" stroke-width="0.6"/>
      <line x1="-300" y1="222" x2="-250" y2="290" stroke="#6366F1" stroke-width="0.6"/>
      <line x1="-200" y1="222" x2="-150" y2="290" stroke="#6366F1" stroke-width="0.6"/>
      <line x1="200" y1="222" x2="150" y2="290" stroke="#6366F1" stroke-width="0.6"/>
      <line x1="200" y1="222" x2="250" y2="290" stroke="#6366F1" stroke-width="0.6"/>
      <line x1="300" y1="222" x2="350" y2="290" stroke="#6366F1" stroke-width="0.6"/>
    </g>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 550)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#00D4FF">LEGEND:</text>
    
    <g transform="translate(0, 20)">
      <circle cx="10" cy="0" r="8" fill="url(#nodeGradient)" stroke="#D4AF37" stroke-width="2"/>
      <text x="25" y="5" font-size="10" fill="#F8F9FA">Sovereign</text>
    </g>
    
    <g transform="translate(0, 40)">
      <circle cx="10" cy="0" r="6" fill="url(#nodeGradient)" stroke="#00D4FF" stroke-width="1.5"/>
      <text x="25" y="5" font-size="10" fill="#F8F9FA">Command Center</text>
    </g>
    
    <g transform="translate(0, 60)">
      <circle cx="10" cy="0" r="5" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="1"/>
      <text x="25" y="5" font-size="10" fill="#F8F9FA">Sub-command</text>
    </g>
    
    <g transform="translate(200, 20)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#00D4FF" stroke-width="1"/>
      <text x="50" y="5" font-size="10" fill="#00D4FF">Command Authority</text>
    </g>
    
    <g transform="translate(200, 40)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#6366F1" stroke-width="0.8"/>
      <text x="50" y="5" font-size="10" fill="#6366F1">Sub-command Link</text>
    </g>
    
    <g transform="translate(400, 20)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#00D4FF" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#00D4FF">VERIFIED</text>
    </g>
    
    <g transform="translate(400, 40)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#6366F1" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#6366F1">REPORTED</text>
    </g>
    
    <g transform="translate(400, 60)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#D4AF37" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#D4AF37">PENDING</text>
    </g>
    
    <g transform="translate(550, 20)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#EF4444" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#EF4444">BLOCKED</text>
    </g>
    
    <g transform="translate(550, 40)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#7C2D12" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#7C2D12">FAILED</text>
    </g>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Governance Diagram - Command Hierarchy</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Template for command hierarchy diagrams with thin cyan connectors, status indicators, and clear node hierarchy.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="policyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    
    <linearGradient id="iceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#B3E5FC"/>
    </linearGradient>
    
    <linearGradient id="verifiedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="pendingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <!-- Filter for glow -->
    <filter id="policyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Background Pattern -->
    <pattern id="policyGrid" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.05"/>
    </pattern>
    
    <!-- Ice Crystal Pattern -->
    <pattern id="icePattern" patternUnits="userSpaceOnUse" width="30" height="30">
      <path d="M0 15 L15 0 L30 15 L15 30 Z" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.1"/>
      <path d="M7.5 15 L15 7.5 L22.5 15 L15 22.5 Z" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0A0A0F"/>
  <rect width="800" height="600" fill="url(#policyGrid)"/>
  
  <!-- Diagram Title -->
  <g id="diagramTitle">
    <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#00D4FF">
      POLICY FREEZE
    </text>
    <text x="400" y="50" text-anchor="middle" font-size="14" fill="#6366F1">
      Fisk Dimension × Omega-9
    </text>
  </g>
  
  <!-- Main Diagram -->
  <g id="policyFreezeDiagram" transform="translate(400, 100)">
    
    <!-- Central Policy Document -->
    <g id="centralPolicy">
      <!-- Document Background -->
      <rect x="-80" y="-60" width="160" height="120" rx="8" fill="url(#policyGradient)" 
            stroke="#D4AF37" stroke-width="3" filter="url(#policyGlow)"/>
      
      <!-- Document Content Area -->
      <rect x="-70" y="-50" width="140" height="100" rx="4" fill="#0F172A"/>
      
      <!-- Document Icon -->
      <path d="M-20 -20 L-20 20 L20 20 L20 -20 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
      <path d="M-20 -20 L0 0 L20 -20" fill="none" stroke="#D4AF37" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#D4AF37"/>
      
      <!-- Document Lines -->
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#6366F1" stroke-width="0.5"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#6366F1" stroke-width="0.5"/>
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#6366F1" stroke-width="0.5"/>
      
      <!-- Document Label -->
      <text x="0" y="-65" text-anchor="middle" font-size="12" font-weight="bold" fill="#D4AF37">
        MASTER POLICY
      </text>
      <text x="0" y="-50" text-anchor="middle" font-size="9" fill="#D4AF37">
        Omega-9 Governance
      </text>
      
      <!-- Freeze Status: Pending -->
      <rect x="-25" y="65" width="50" height="20" rx="4" fill="#D4AF37" opacity="0.2"/>
      <text x="0" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#D4AF37">
        FROZEN
      </text>
      
      <!-- Freeze Icon: Snowflake -->
      <g transform="translate(0, 65)">
        <path d="M0 -8 L0 8 M-8 0 L8 0 M-6 -6 L6 6 M-6 6 L6 -6" 
              stroke="#D4AF37" stroke-width="1.5"/>
      </g>
    </g>
    
    <!-- Ice/Freeze Effect Overlay -->
    <g id="freezeEffect" opacity="0.3">
      <rect x="-100" y="-80" width="200" height="160" rx="8" fill="url(#icePattern)"/>
      <ellipse cx="0" cy="0" rx="100" ry="80" fill="#00D4FF" opacity="0.05"/>
    </g>
    
    <!-- Sub-Policies (Frozen) -->
    
    <!-- Sub-Policy 1: Security -->
    <g id="subPolicy1" transform="translate(-250, -150)">
      <!-- Document -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#policyGradient)" 
            stroke="#6366F1" stroke-width="2"/>
      
      <!-- Document Icon -->
      <path d="M-15 -15 L-15 15 L15 15 L15 -15 Z" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <path d="M-15 -15 L0 0 L15 -15" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#6366F1"/>
      
      <!-- Document Label -->
      <text x="0" y="-45" text-anchor="middle" font-size="10" font-weight="bold" fill="#6366F1">
        SECURITY POLICY
      </text>
      
      <!-- Freeze Status -->
      <rect x="-20" y="45" width="40" height="14" rx="3" fill="#D4AF37" opacity="0.2"/>
      <text x="0" y="52" text-anchor="middle" font-size="8" fill="#D4AF37">FROZEN</text>
      
      <!-- Freeze Icon -->
      <path d="M25 48 L25 52 M22 50 L28 50" stroke="#D4AF37" stroke-width="1"/>
      
      <!-- Connection to Master -->
      <line x1="0" y1="-40" x2="150" y2="-60" stroke="#6366F1" stroke-width="1" stroke-dasharray="2,1"/>
    </g>
    
    <!-- Sub-Policy 2: Access -->
    <g id="subPolicy2" transform="translate(-150, -50)">
      <!-- Document -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#policyGradient)" 
            stroke="#6366F1" stroke-width="2"/>
      
      <!-- Document Icon -->
      <path d="M-15 -15 L-15 15 L15 15 L15 -15 Z" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <path d="M-15 -15 L0 0 L15 -15" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#6366F1"/>
      
      <!-- Document Label -->
      <text x="0" y="-45" text-anchor="middle" font-size="10" font-weight="bold" fill="#6366F1">
        ACCESS POLICY
      </text>
      
      <!-- Freeze Status -->
      <rect x="-20" y="45" width="40" height="14" rx="3" fill="#D4AF37" opacity="0.2"/>
      <text x="0" y="52" text-anchor="middle" font-size="8" fill="#D4AF37">FROZEN</text>
      
      <!-- Freeze Icon -->
      <path d="M25 48 L25 52 M22 50 L28 50" stroke="#D4AF37" stroke-width="1"/>
      
      <!-- Connection to Master -->
      <line x1="0" y1="-40" x2="100" y2="-60" stroke="#6366F1" stroke-width="1" stroke-dasharray="2,1"/>
    </g>
    
    <!-- Sub-Policy 3: Data -->
    <g id="subPolicy3" transform="translate(-50, 50)">
      <!-- Document -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#policyGradient)" 
            stroke="#6366F1" stroke-width="2"/>
      
      <!-- Document Icon -->
      <path d="M-15 -15 L-15 15 L15 15 L15 -15 Z" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <path d="M-15 -15 L0 0 L15 -15" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#6366F1"/>
      
      <!-- Document Label -->
      <text x="0" y="-45" text-anchor="middle" font-size="10" font-weight="bold" fill="#6366F1">
        DATA POLICY
      </text>
      
      <!-- Freeze Status -->
      <rect x="-20" y="45" width="40" height="14" rx="3" fill="#D4AF37" opacity="0.2"/>
      <text x="0" y="52" text-anchor="middle" font-size="8" fill="#D4AF37">FROZEN</text>
      
      <!-- Freeze Icon -->
      <path d="M25 48 L25 52 M22 50 L28 50" stroke="#D4AF37" stroke-width="1"/>
      
      <!-- Connection to Master -->
      <line x1="0" y1="-40" x2="50" y2="-60" stroke="#6366F1" stroke-width="1" stroke-dasharray="2,1"/>
    </g>
    
    <!-- Sub-Policy 4: Audit -->
    <g id="subPolicy4" transform="translate(50, 150)">
      <!-- Document -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#policyGradient)" 
            stroke="#6366F1" stroke-width="2"/>
      
      <!-- Document Icon -->
      <path d="M-15 -15 L-15 15 L15 15 L15 -15 Z" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <path d="M-15 -15 L0 0 L15 -15" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#6366F1"/>
      
      <!-- Document Label -->
      <text x="0" y="-45" text-anchor="middle" font-size="10" font-weight="bold" fill="#6366F1">
        AUDIT POLICY
      </text>
      
      <!-- Freeze Status -->
      <rect x="-20" y="45" width="40" height="14" rx="3" fill="#D4AF37" opacity="0.2"/>
      <text x="0" y="52" text-anchor="middle" font-size="8" fill="#D4AF37">FROZEN</text>
      
      <!-- Freeze Icon -->
      <path d="M25 48 L25 52 M22 50 L28 50" stroke="#D4AF37" stroke-width="1"/>
      
      <!-- Connection to Master -->
      <line x1="0" y1="-40" x2="-50" y2="-60" stroke="#6366F1" stroke-width="1" stroke-dasharray="2,1"/>
    </g>
    
    <!-- Freeze Duration Indicator -->
    <g id="freezeDuration" transform="translate(0, -80)">
      <!-- Duration Circle -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Duration Text -->
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#D4AF37">
        24 HOURS
      </text>
      <text x="0" y="-10" text-anchor="middle" font-size="8" fill="#D4AF37">
        Remaining
      </text>
      
      <!-- Progress Arc -->
      <path d="M0 -30 A30 30 0 0 1 21 -21" fill="none" stroke="#D4AF37" stroke-width="2" 
            stroke-linecap="round"/>
      <path d="M21 -21 A30 30 0 0 1 -21 21" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
    </g>
    
    <!-- Freeze Initiator -->
    <g id="freezeInitiator" transform="translate(250, -150)">
      <!-- Entity Circle -->
      <circle cx="0" cy="0" r="25" fill="#0F172A" stroke="#00D4FF" stroke-width="2"/>
      
      <!-- Icon: Crown -->
      <path d="M-8 -15 L-3 -20 L3 -20 L8 -15 Q10 -12 8 -10 L3 -10 L-3 -10 L-8 -12 Q-10 -12 -8 -15 Z" 
            fill="#D4AF37" stroke="#B8860B" stroke-width="0.5"/>
      <circle cx="0" cy="-12" r="2" fill="#1E3A8A"/>
      
      <!-- Label -->
      <text x="0" y="5" text-anchor="middle" font-size="9" font-weight="bold" fill="#00D4FF">
        KING NEXUS
      </text>
      <text x="0" y="-18" text-anchor="middle" font-size="7" fill="#00D4FF">
        Freeze Initiator
      </text>
      
      <!-- Connection to Master Policy -->
      <line x1="0" y1="0" x2="-150" y2="50" stroke="#00D4FF" stroke-width="1.5" 
            stroke-dasharray="4,2"/>
      <path d="M-138 62 L-150 50 L-142 58" fill="#00D4FF" opacity="0.8"/>
      <path d="M-138 62 L-150 50 L-142 58" fill="none" stroke="#00D4FF" stroke-width="0.5"/>
    </g>
    
    <!-- Affected Entities (Outside Freeze Zone) -->
    
    <!-- Entity 1: Blocked -->
    <g id="affectedEntity1" transform="translate(300, -100)">
      <!-- Entity Circle -->
      <circle cx="0" cy="0" r="20" fill="#1E3A8A" stroke="#EF4444" stroke-width="2"/>
      
      <!-- Icon: X -->
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#EF4444" stroke-width="2"/>
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#EF4444" stroke-width="2"/>
      
      <!-- Label -->
      <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
        COMMAND-01
      </text>
      <text x="0" y="-15" text-anchor="middle" font-size="6" fill="#EF4444">
        Blocked
      </text>
      
      <!-- Connection from Policy (Blocked) -->
      <line x1="-100" y1="-100" x2="-10" y2="0" stroke="#EF4444" stroke-width="1" stroke-dasharray="2,1"/>
    </g>
    
    <!-- Entity 2: Pending -->
    <g id="affectedEntity2" transform="translate(300, 100)">
      <!-- Entity Circle -->
      <circle cx="0" cy="0" r="20" fill="#1E3A8A" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Icon: Hourglass -->
      <rect x="-6" y="-8" width="12" height="16" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#D4AF37" stroke-width="1.5"/>
      
      <!-- Label -->
      <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#F8F9FA">
        COMMAND-02
      </text>
      <text x="0" y="-15" text-anchor="middle" font-size="6" fill="#D4AF37">
        Queued
      </text>
      
      <!-- Connection from Policy (Pending) -->
      <line x1="-100" y1="100" x2="-10" y2="0" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2,1"/>
    </g>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 550)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#00D4FF">LEGEND:</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="-10" width="20" height="16" rx="2" fill="url(#policyGradient)" stroke="#D4AF37" stroke-width="1"/>
      <text x="25" y="5" font-size="10" fill="#F8F9FA">Policy Document</text>
    </g>
    
    <g transform="translate(0, 50)">
      <circle cx="10" cy="0" r="8" fill="#0F172A" stroke="#00D4FF" stroke-width="1.5"/>
      <text x="25" y="5" font-size="10" fill="#F8F9FA">Entity</text>
    </g>
    
    <g transform="translate(0, 80)">
      <path d="M0 0 L8 8 L16 0 L8 -8 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
      <text x="25" y="5" font-size="10" fill="#D4AF37">Freeze Icon</text>
    </g>
    
    <g transform="translate(250, 20)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#D4AF37" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#D4AF37">FROZEN</text>
    </g>
    
    <g transform="translate(250, 50)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#6366F1" stroke-width="1" stroke-dasharray="2,1"/>
      <text x="50" y="5" font-size="8" fill="#6366F1">Policy Connection</text>
    </g>
    
    <g transform="translate(250, 80)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="50" y="5" font-size="8" fill="#00D4FF">Freeze Connection</text>
    </g>
    
    <g transform="translate(500, 20)">
      <circle cx="10" cy="0" r="8" fill="#1E3A8A" stroke="#EF4444" stroke-width="1.5"/>
      <line x1="6" y1="-2" x2="14" y2="2" stroke="#F8F9FA" stroke-width="1"/>
      <line x1="6" y1="2" x2="14" y2="-2" stroke="#F8F9FA" stroke-width="1"/>
      <text x="25" y="5" font-size="8" fill="#EF4444">BLOCKED</text>
    </g>
    
    <g transform="translate(500, 50)">
      <circle cx="10" cy="0" r="8" fill="#1E3A8A" stroke="#D4AF37" stroke-width="1.5"/>
      <rect x="6" y="-3" width="8" height="6" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
      <line x1="6" y1="0" x2="14" y2="0" stroke="#D4AF37" stroke-width="0.5"/>
      <text x="25" y="5" font-size="8" fill="#D4AF37">QUEUED</text>
    </g>
    
    <g transform="translate(500, 80)">
      <circle cx="10" cy="0" r="8" fill="#1E3A8A" stroke="#00D4FF" stroke-width="1.5"/>
      <path d="M6 0 L8 -3 L12 1" fill="none" stroke="#00D4FF" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="5" font-size="8" fill="#00D4FF">VERIFIED</text>
    </g>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Governance Diagram - Policy Freeze</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Template for policy freeze diagrams with ice/snowflake motifs, policy documents, freeze indicators, and duration displays.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

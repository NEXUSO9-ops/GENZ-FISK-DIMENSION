<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="eventGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="verifiedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="reportedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    
    <linearGradient id="pendingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <linearGradient id="blockedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    
    <linearGradient id="failedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#591F0A"/>
    </linearGradient>
    
    <!-- Filter for glow -->
    <filter id="eventGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Background Pattern -->
    <pattern id="auditGrid" patternUnits="userSpaceOnUse" width="30" height="30">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00D4FF" stroke-width="0.3" opacity="0.05"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0A0A0F"/>
  <rect width="800" height="600" fill="url(#auditGrid)"/>
  
  <!-- Diagram Title -->
  <g id="diagramTitle">
    <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#00D4FF">
      AUDIT HISTORY
    </text>
    <text x="400" y="50" text-anchor="middle" font-size="14" fill="#6366F1">
      Fisk Dimension × Omega-9
    </text>
  </g>
  
  <!-- Main Diagram -->
  <g id="auditHistoryDiagram" transform="translate(400, 100)">
    
    <!-- Timeline (Horizontal) -->
    <g id="timeline">
      <!-- Timeline Line -->
      <line x1="-350" y1="0" x2="350" y2="0" stroke="#00D4FF" stroke-width="2"/>
      
      <!-- Time Markers -->
      <g transform="translate(-300, 0)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#00D4FF" stroke-width="2"/>
        <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#00D4FF">10:00</text>
        <text x="0" y="-15" text-anchor="middle" font-size="8" fill="#00D4FF">JAN 15</text>
      </g>
      
      <g transform="translate(-200, 0)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#00D4FF" stroke-width="2"/>
        <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#00D4FF">11:00</text>
      </g>
      
      <g transform="translate(-100, 0)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#00D4FF" stroke-width="2"/>
        <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#00D4FF">12:00</text>
      </g>
      
      <g transform="translate(0, 0)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#00D4FF" stroke-width="2"/>
        <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#00D4FF">13:00</text>
      </g>
      
      <g transform="translate(100, 0)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#00D4FF" stroke-width="2"/>
        <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#00D4FF">14:00</text>
      </g>
      
      <g transform="translate(200, 0)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#00D4FF" stroke-width="2"/>
        <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#00D4FF">15:00</text>
      </g>
      
      <g transform="translate(300, 0)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#00D4FF" stroke-width="2"/>
        <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#00D4FF">16:00</text>
      </g>
    </g>
    
    <!-- Audit Events -->
    
    <!-- Event 1: Verified (10:30) -->
    <g id="event1" transform="translate(-280, 80)">
      <!-- Event Card -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#eventGradient)" 
            stroke="#00D4FF" stroke-width="2" filter="url(#eventGlow)"/>
      
      <!-- Event Icon: Checkmark -->
      <circle cx="-40" cy="-20" r="10" fill="url(#verifiedGradient)"/>
      <path d="M-44 -20 L-42 -17 L-36 -23" fill="none" stroke="#0A0A0F" stroke-width="1.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Event Details -->
      <text x="-40" y="-30" text-anchor="middle" font-size="8" font-weight="bold" fill="#00D4FF">
        SECURITY SCAN
      </text>
      <text x="-40" y="-15" text-anchor="middle" font-size="7" fill="#00D4FF">
        Sentinel-01
      </text>
      
      <!-- Timestamp -->
      <text x="-40" y="10" text-anchor="middle" font-size="7" fill="#00D4FF">
        10:30:18
      </text>
      
      <!-- Status Badge -->
      <rect x="-40" y="20" width="80" height="14" rx="4" fill="#00D4FF" opacity="0.2"/>
      <text x="0" y="27" text-anchor="middle" font-size="8" fill="#00D4FF">VERIFIED</text>
      
      <!-- Connector to Timeline -->
      <line x1="-40" y1="-40" x2="-40" y2="0" stroke="#00D4FF" stroke-width="1" stroke-dasharray="2,1"/>
      <circle cx="-40" cy="0" r="4" fill="#00D4FF"/>
    </g>
    
    <!-- Event 2: Reported (11:15) -->
    <g id="event2" transform="translate(-180, 80)">
      <!-- Event Card -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#eventGradient)" 
            stroke="#6366F1" stroke-width="2" filter="url(#eventGlow)"/>
      
      <!-- Event Icon: Triangle -->
      <path d="M-50 -25 L-45 -15 L-55 -15 Z" fill="#6366F1" opacity="0.8"/>
      <path d="M-50 -25 L-45 -15 L-55 -15 Z" fill="none" stroke="#6366F1" stroke-width="0.5"/>
      
      <!-- Event Details -->
      <text x="-40" y="-30" text-anchor="middle" font-size="8" font-weight="bold" fill="#6366F1">
        ACCESS REQUEST
      </text>
      <text x="-40" y="-15" text-anchor="middle" font-size="7" fill="#6366F1">
        Observer-12
      </text>
      
      <!-- Timestamp -->
      <text x="-40" y="10" text-anchor="middle" font-size="7" fill="#6366F1">
        11:15:47
      </text>
      
      <!-- Status Badge -->
      <rect x="-40" y="20" width="80" height="14" rx="4" fill="#6366F1" opacity="0.2"/>
      <text x="0" y="27" text-anchor="middle" font-size="8" fill="#6366F1">REPORTED</text>
      
      <!-- Connector to Timeline -->
      <line x1="-40" y1="-40" x2="-40" y2="0" stroke="#6366F1" stroke-width="1" stroke-dasharray="2,1"/>
      <circle cx="-40" cy="0" r="4" fill="#6366F1"/>
    </g>
    
    <!-- Event 3: Pending (11:45) -->
    <g id="event3" transform="translate(-80, 80)">
      <!-- Event Card -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#eventGradient)" 
            stroke="#D4AF37" stroke-width="2" filter="url(#eventGlow)"/>
      
      <!-- Event Icon: Hourglass -->
      <rect x="-50" y="-25" width="10" height="20" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <line x1="-45" y1="-20" x2="-35" y2="-20" stroke="#D4AF37" stroke-width="1.5"/>
      <line x1="-45" y1="-10" x2="-35" y2="-10" stroke="#D4AF37" stroke-width="1.5"/>
      <rect x="-48" y="-18" width="8" height="4" fill="#D4AF37" opacity="0.8"/>
      <rect x="-48" y="-12" width="8" height="4" fill="#D4AF37" opacity="0.8"/>
      
      <!-- Event Details -->
      <text x="-40" y="-30" text-anchor="middle" font-size="8" font-weight="bold" fill="#D4AF37">
        POLICY UPDATE
      </text>
      <text x="-40" y="-15" text-anchor="middle" font-size="7" fill="#D4AF37">
        Governor-05
      </text>
      
      <!-- Timestamp -->
      <text x="-40" y="10" text-anchor="middle" font-size="7" fill="#D4AF37">
        11:45:22
      </text>
      
      <!-- Status Badge -->
      <rect x="-40" y="20" width="80" height="14" rx="4" fill="#D4AF37" opacity="0.2"/>
      <text x="0" y="27" text-anchor="middle" font-size="8" fill="#D4AF37">PENDING</text>
      
      <!-- Connector to Timeline -->
      <line x1="-40" y1="-40" x2="-40" y2="0" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2,1"/>
      <circle cx="-40" cy="0" r="4" fill="#D4AF37"/>
    </g>
    
    <!-- Event 4: Blocked (12:30) -->
    <g id="event4" transform="translate(20, 80)">
      <!-- Event Card -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#eventGradient)" 
            stroke="#EF4444" stroke-width="2" filter="url(#eventGlow)"/>
      
      <!-- Event Icon: Square with Slash -->
      <rect x="-50" y="-25" width="10" height="10" fill="#EF4444" opacity="0.8"/>
      <line x1="-45" y1="-30" x2="-35" y2="-20" stroke="#F8F9FA" stroke-width="1.5"/>
      
      <!-- Event Details -->
      <text x="-40" y="-30" text-anchor="middle" font-size="8" font-weight="bold" fill="#EF4444">
        DATA SYNC
      </text>
      <text x="-40" y="-15" text-anchor="middle" font-size="7" fill="#EF4444">
        Relay-03
      </text>
      
      <!-- Timestamp -->
      <text x="-40" y="10" text-anchor="middle" font-size="7" fill="#EF4444">
        12:30:33
      </text>
      
      <!-- Status Badge -->
      <rect x="-40" y="20" width="80" height="14" rx="4" fill="#EF4444" opacity="0.2"/>
      <text x="0" y="27" text-anchor="middle" font-size="8" fill="#EF4444">BLOCKED</text>
      
      <!-- Connector to Timeline -->
      <line x1="-40" y1="-40" x2="-40" y2="0" stroke="#EF4444" stroke-width="1" stroke-dasharray="2,1"/>
      <circle cx="-40" cy="0" r="4" fill="#EF4444"/>
    </g>
    
    <!-- Event 5: Failed (13:45) -->
    <g id="event5" transform="translate(120, 80)">
      <!-- Event Card -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#eventGradient)" 
            stroke="#7C2D12" stroke-width="2" filter="url(#eventGlow)"/>
      
      <!-- Event Icon: X Circle -->
      <circle cx="-40" cy="-20" r="8" fill="#7C2D12"/>
      <line x1="-44" y1="-20" x2="-36" y2="-20" stroke="#F8F9FA" stroke-width="1.5"/>
      <line x1="-40" y1="-24" x2="-40" y2="-16" stroke="#F8F9FA" stroke-width="1.5"/>
      
      <!-- Event Details -->
      <text x="-40" y="-30" text-anchor="middle" font-size="8" font-weight="bold" fill="#7C2D12">
        AUDIT TRAIL
      </text>
      <text x="-40" y="-15" text-anchor="middle" font-size="7" fill="#7C2D12">
        Archivist-07
      </text>
      
      <!-- Timestamp -->
      <text x="-40" y="10" text-anchor="middle" font-size="7" fill="#7C2D12">
        13:45:11
      </text>
      
      <!-- Status Badge -->
      <rect x="-40" y="20" width="80" height="14" rx="4" fill="#7C2D12" opacity="0.2"/>
      <text x="0" y="27" text-anchor="middle" font-size="8" fill="#7C2D12">FAILED</text>
      
      <!-- Connector to Timeline -->
      <line x1="-40" y1="-40" x2="-40" y2="0" stroke="#7C2D12" stroke-width="1" stroke-dasharray="2,1"/>
      <circle cx="-40" cy="0" r="4" fill="#7C2D12"/>
    </g>
    
    <!-- Event 6: Verified (14:15) -->
    <g id="event6" transform="translate(220, 80)">
      <!-- Event Card -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#eventGradient)" 
            stroke="#00D4FF" stroke-width="2" filter="url(#eventGlow)"/>
      
      <!-- Event Icon: Checkmark -->
      <circle cx="-40" cy="-20" r="10" fill="url(#verifiedGradient)"/>
      <path d="M-44 -20 L-42 -17 L-36 -23" fill="none" stroke="#0A0A0F" stroke-width="1.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Event Details -->
      <text x="-40" y="-30" text-anchor="middle" font-size="8" font-weight="bold" fill="#00D4FF">
        SECURITY CHECK
      </text>
      <text x="-40" y="-15" text-anchor="middle" font-size="7" fill="#00D4FF">
        Throne
      </text>
      
      <!-- Timestamp -->
      <text x="-40" y="10" text-anchor="middle" font-size="7" fill="#00D4FF">
        14:15:00
      </text>
      
      <!-- Status Badge -->
      <rect x="-40" y="20" width="80" height="14" rx="4" fill="#00D4FF" opacity="0.2"/>
      <text x="0" y="27" text-anchor="middle" font-size="8" fill="#00D4FF">VERIFIED</text>
      
      <!-- Connector to Timeline -->
      <line x1="-40" y1="-40" x2="-40" y2="0" stroke="#00D4FF" stroke-width="1" stroke-dasharray="2,1"/>
      <circle cx="-40" cy="0" r="4" fill="#00D4FF"/>
    </g>
    
    <!-- Filter Controls -->
    <g id="filterControls" transform="translate(-350, -100)">
      <!-- Filter Section -->
      <rect x="-80" y="-30" width="160" height="60" rx="6" fill="#0F172A" 
            stroke="#00D4FF" stroke-width="2"/>
      
      <!-- Filter Label -->
      <text x="0" y="-25" text-anchor="middle" font-size="10" font-weight="bold" fill="#00D4FF">
        FILTER
      </text>
      
      <!-- Filter Tags -->
      <g transform="translate(-30, -5)">
        <rect x="0" y="0" width="24" height="16" rx="3" fill="#00D4FF" opacity="0.2"/>
        <text x="12" y="10" text-anchor="middle" font-size="7" fill="#00D4FF">ALL</text>
      </g>
      
      <g transform="translate(-5, -5)">
        <rect x="0" y="0" width="24" height="16" rx="3" fill="#00D4FF" opacity="0.4"/>
        <text x="12" y="10" text-anchor="middle" font-size="7" fill="#00D4FF">VERIFIED</text>
      </g>
      
      <g transform="translate(20, -5)">
        <rect x="0" y="0" width="24" height="16" rx="3" fill="#6366F1" opacity="0.4"/>
        <text x="12" y="10" text-anchor="middle" font-size="7" fill="#6366F1">REPORTED</text>
      </g>
      
      <g transform="translate(45, -5)">
        <rect x="0" y="0" width="24" height="16" rx="3" fill="#D4AF37" opacity="0.4"/>
        <text x="12" y="10" text-anchor="middle" font-size="7" fill="#D4AF37">PENDING</text>
      </g>
      
      <g transform="translate(70, -5)">
        <rect x="0" y="0" width="24" height="16" rx="3" fill="#EF4444" opacity="0.4"/>
        <text x="12" y="10" text-anchor="middle" font-size="7" fill="#EF4444">BLOCKED</text>
      </g>
      
      <g transform="translate(95, -5)">
        <rect x="0" y="0" width="24" height="16" rx="3" fill="#7C2D12" opacity="0.4"/>
        <text x="12" y="10" text-anchor="middle" font-size="7" fill="#7C2D12">FAILED</text>
      </g>
    </g>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 550)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#00D4FF">LEGEND:</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="-10" width="20" height="16" rx="2" fill="url(#eventGradient)" stroke="#00D4FF" stroke-width="1"/>
      <text x="25" y="5" font-size="10" fill="#F8F9FA">Audit Event</text>
    </g>
    
    <g transform="translate(0, 50)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#00D4FF" stroke-width="2"/>
      <text x="50" y="5" font-size="10" fill="#00D4FF">Timeline</text>
    </g>
    
    <g transform="translate(0, 80)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#00D4FF" stroke-width="1" stroke-dasharray="2,1"/>
      <circle cx="0" cy="20" r="2" fill="#00D4FF"/>
      <text x="10" y="5" font-size="10" fill="#F8F9FA">Event Connector</text>
    </g>
    
    <g transform="translate(250, 20)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#00D4FF" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#00D4FF">VERIFIED</text>
    </g>
    
    <g transform="translate(250, 50)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#6366F1" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#6366F1">REPORTED</text>
    </g>
    
    <g transform="translate(250, 80)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#D4AF37" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#D4AF37">PENDING</text>
    </g>
    
    <g transform="translate(400, 20)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#EF4444" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#EF4444">BLOCKED</text>
    </g>
    
    <g transform="translate(400, 50)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#7C2D12" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#7C2D12">FAILED</text>
    </g>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Governance Diagram - Audit History</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Template for audit history diagrams with timeline, event cards, status indicators, and filter controls.
          Part of the Fisk Dimension × Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>

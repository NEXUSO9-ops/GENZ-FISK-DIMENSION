<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Color Definitions -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    
    <linearGradient id="nodeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <linearGradient id="progressVerified" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="progressReported" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    
    <linearGradient id="progressPending" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <linearGradient id="progressBlocked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    
    <linearGradient id="progressFailed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#591F0A"/>
    </linearGradient>
    
    <!-- Filter for glow -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Background Pattern -->
    <pattern id="diagramGrid" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    
    <!-- Status Colors for legend -->
    <linearGradient id="statusVerified" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    
    <linearGradient id="statusReported" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    
    <linearGradient id="statusPending" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <linearGradient id="statusBlocked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    
    <linearGradient id="statusFailed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#591F0A"/>
    </linearGradient>
    
    <!-- Arrowhead Marker Definition -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" 
            orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4FF"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0A0A0F"/>
  <rect width="800" height="600" fill="url(#diagramGrid)"/>
  
  <!-- Diagram Title -->
  <g id="diagramTitle">
    <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#00D4FF">
      RELEASE STATUS
    </text>
    <text x="400" y="50" text-anchor="middle" font-size="14" fill="#6366F1">
      Fisk Dimension x Omega-9
    </text>
  </g>
  
  <!-- Main Diagram -->
  <g id="releaseStatusDiagram" transform="translate(400, 100)">
    
    <!-- Central Release: v1.0.0 (Verified) -->
    <g id="releaseMain" transform="translate(0, -100)">
      <!-- Outer Ring (Progress) -->
      <circle cx="0" cy="0" r="80" fill="none" stroke="#00D4FF" stroke-width="8" 
              stroke-dasharray="502.65" stroke-dashoffset="0" opacity="0.3"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="url(#progressVerified)" stroke-width="8" 
              stroke-dasharray="502.65" stroke-dashoffset="50.27" stroke-linecap="round"/>
      
      <!-- Node -->
      <circle cx="0" cy="0" r="50" fill="url(#nodeGradient)" stroke="#D4AF37" stroke-width="3" 
              filter="url(#nodeGlow)"/>
      <circle cx="0" cy="0" r="40" fill="url(#nodeHighlight)" opacity="0.6"/>
      
      <!-- Version Tag -->
      <rect x="-25" y="-12" width="50" height="24" rx="4" fill="#00D4FF" opacity="0.2"/>
      <text x="0" y="-5" text-anchor="middle" font-size="12" font-weight="bold" fill="#00D4FF">
        v1.0.0
      </text>
      
      <!-- Release Name -->
      <text x="0" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#F8F9FA">
        SOVEREIGN CORE
      </text>
      
      <!-- Status Badge -->
      <rect x="-20" y="35" width="40" height="14" rx="4" fill="#00D4FF" opacity="0.2"/>
      <text x="0" y="43" text-anchor="middle" font-size="8" fill="#00D4FF">VERIFIED</text>
      
      <!-- Progress Text -->
      <text x="0" y="55" text-anchor="middle" font-size="8" fill="#00D4FF">90% COMPLETE</text>
    </g>
    
    <!-- Dependency: Alpha (Verified) -->
    <g id="releaseAlpha" transform="translate(-200, 0)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#00D4FF" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="0" opacity="0.3"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="url(#progressVerified)" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="25.13" stroke-linecap="round"/>
      
      <!-- Node -->
      <circle cx="0" cy="0" r="30" fill="url(#nodeGradient)" stroke="#00D4FF" stroke-width="2"/>
      
      <!-- Version Tag -->
      <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#00D4FF" opacity="0.2"/>
      <text x="0" y="0" text-anchor="middle" font-size="9" font-weight="bold" fill="#00D4FF">
        v1.0.0-alpha
      </text>
      
      <!-- Release Name -->
      <text x="0" y="20" text-anchor="middle" font-size="8" fill="#F8F9FA">
        Foundation
      </text>
      
      <!-- Status Badge -->
      <rect x="-18" y="32" width="36" height="12" rx="3" fill="#00D4FF" opacity="0.2"/>
      <text x="0" y="40" text-anchor="middle" font-size="7" fill="#00D4FF">VERIFIED</text>
      
      <!-- Progress Text -->
      <text x="0" y="50" text-anchor="middle" font-size="7" fill="#00D4FF">100%</text>
      
      <!-- Connector to Main -->
      <line x1="0" y1="-30" x2="100" y2="-130" stroke="#00D4FF" stroke-width="1" 
            stroke-dasharray="2,1" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- Dependency: Beta (Reported) -->
    <g id="releaseBeta" transform="translate(-120, 120)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#6366F1" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="125.67" opacity="0.3"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="url(#progressReported)" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="150.80" stroke-linecap="round"/>
      
      <!-- Node -->
      <circle cx="0" cy="0" r="30" fill="url(#nodeGradient)" stroke="#6366F1" stroke-width="2"/>
      
      <!-- Version Tag -->
      <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#6366F1" opacity="0.2"/>
      <text x="0" y="0" text-anchor="middle" font-size="9" font-weight="bold" fill="#6366F1">
        v1.0.0-beta
      </text>
      
      <!-- Release Name -->
      <text x="0" y="20" text-anchor="middle" font-size="8" fill="#F8F9FA">
        Intelligence
      </text>
      
      <!-- Status Badge -->
      <rect x="-18" y="32" width="36" height="12" rx="3" fill="#6366F1" opacity="0.2"/>
      <text x="0" y="40" text-anchor="middle" font-size="7" fill="#6366F1">REPORTED</text>
      
      <!-- Progress Text -->
      <text x="0" y="50" text-anchor="middle" font-size="7" fill="#6366F1">50%</text>
      
      <!-- Connector to Main -->
      <line x1="0" y1="-30" x2="80" y2="-170" stroke="#6366F1" stroke-width="1" 
            stroke-dasharray="2,1" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- Dependency: RC1 (Pending) -->
    <g id="releaseRC1" transform="translate(120, 120)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#D4AF37" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="188.50" opacity="0.3"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="url(#progressPending)" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="201.06" stroke-linecap="round"/>
      
      <!-- Node -->
      <circle cx="0" cy="0" r="30" fill="url(#nodeGradient)" stroke="#D4AF37" stroke-width="2"/>
      
      <!-- Version Tag -->
      <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#D4AF37" opacity="0.2"/>
      <text x="0" y="0" text-anchor="middle" font-size="9" font-weight="bold" fill="#D4AF37">
        v1.0.0-rc.1
      </text>
      
      <!-- Release Name -->
      <text x="0" y="20" text-anchor="middle" font-size="8" fill="#F8F9FA">
        Sentinel
      </text>
      
      <!-- Status Badge -->
      <rect x="-18" y="32" width="36" height="12" rx="3" fill="#D4AF37" opacity="0.2"/>
      <text x="0" y="40" text-anchor="middle" font-size="7" fill="#D4AF37">PENDING</text>
      
      <!-- Progress Text -->
      <text x="0" y="50" text-anchor="middle" font-size="7" fill="#D4AF37">25%</text>
      
      <!-- Connector to Main -->
      <line x1="0" y1="-30" x2="-80" y2="-170" stroke="#D4AF37" stroke-width="1" 
            stroke-dasharray="2,1" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- Dependency: Blocked (Blocked) -->
    <g id="releaseBlocked" transform="translate(200, 0)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#EF4444" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="251.33" opacity="0.3"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="url(#progressBlocked)" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="251.33" stroke-linecap="round"/>
      
      <!-- Node -->
      <circle cx="0" cy="0" r="30" fill="url(#nodeGradient)" stroke="#EF4444" stroke-width="2"/>
      
      <!-- Version Tag -->
      <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#EF4444" opacity="0.2"/>
      <text x="0" y="0" text-anchor="middle" font-size="9" font-weight="bold" fill="#EF4444">
        v0.9.2
      </text>
      
      <!-- Release Name -->
      <text x="0" y="20" text-anchor="middle" font-size="8" fill="#F8F9FA">
        Legacy
      </text>
      
      <!-- Status Badge -->
      <rect x="-18" y="32" width="36" height="12" rx="3" fill="#EF4444" opacity="0.2"/>
      <text x="0" y="40" text-anchor="middle" font-size="7" fill="#EF4444">BLOCKED</text>
      
      <!-- Progress Text -->
      <text x="0" y="50" text-anchor="middle" font-size="7" fill="#EF4444">0%</text>
      
      <!-- Connector to Main (dashed for blocked) -->
      <line x1="0" y1="-30" x2="-100" y2="-130" stroke="#EF4444" stroke-width="1" 
            stroke-dasharray="2,2" opacity="0.5"/>
    </g>
    
    <!-- Dependency: Failed (Failed) -->
    <g id="releaseFailed" transform="translate(0, 200)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#7C2D12" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="251.33" opacity="0.3"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="url(#progressFailed)" stroke-width="4" 
              stroke-dasharray="251.33" stroke-dashoffset="251.33" stroke-linecap="round"/>
      
      <!-- Node -->
      <circle cx="0" cy="0" r="30" fill="url(#nodeGradient)" stroke="#7C2D12" stroke-width="2"/>
      
      <!-- Version Tag -->
      <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#7C2D12" opacity="0.2"/>
      <text x="0" y="0" text-anchor="middle" font-size="9" font-weight="bold" fill="#7C2D12">
        v1.0.0-exp
      </text>
      
      <!-- Release Name -->
      <text x="0" y="20" text-anchor="middle" font-size="8" fill="#F8F9FA">
        Experimental
      </text>
      
      <!-- Status Badge -->
      <rect x="-18" y="32" width="36" height="12" rx="3" fill="#7C2D12" opacity="0.2"/>
      <text x="0" y="40" text-anchor="middle" font-size="7" fill="#7C2D12">FAILED</text>
      
      <!-- Progress Text -->
      <text x="0" y="50" text-anchor="middle" font-size="7" fill="#7C2D12">0%</text>
      
      <!-- Connector to Main (dashed for failed) -->
      <line x1="0" y1="-30" x2="0" y2="-130" stroke="#7C2D12" stroke-width="1" 
            stroke-dasharray="2,2" opacity="0.5"/>
    </g>
    
    <!-- Dependency Lines (Secondary) -->
    <g id="dependencyLines">
      <!-- Beta -> RC1 dependency -->
      <line x1="-120" y1="80" x2="120" y2="80" stroke="#6366F1" stroke-width="1" 
            stroke-dasharray="2,1" opacity="0.5"/>
      
      <!-- RC1 -> Main dependency -->
      <line x1="120" y1="80" x2="0" y2="-40" stroke="#D4AF37" stroke-width="1" 
            stroke-dasharray="2,1" opacity="0.5"/>
      
      <!-- Alpha -> Main dependency -->
      <line x1="-200" y1="0" x2="0" y2="-40" stroke="#00D4FF" stroke-width="1" 
            stroke-dasharray="2,1" opacity="0.5"/>
    </g>
    
    <!-- Version Tags Section -->
    <g id="versionTags" transform="translate(-300, -100)">
      <!-- Section Background -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="#0F172A" 
            stroke="#00D4FF" stroke-width="2"/>
      
      <!-- Section Title -->
      <text x="0" y="-35" text-anchor="middle" font-size="10" font-weight="bold" fill="#00D4FF">
        VERSION TAGS
      </text>
      
      <!-- Tag Examples -->
      <g transform="translate(-40, -10)">
        <rect x="0" y="0" width="40" height="16" rx="3" fill="#00D4FF" opacity="0.2"/>
        <text x="20" y="10" text-anchor="middle" font-size="7" fill="#00D4FF">v1.0.0</text>
      </g>
      
      <g transform="translate(-40, 10)">
        <rect x="0" y="0" width="48" height="16" rx="3" fill="#6366F1" opacity="0.2"/>
        <text x="24" y="10" text-anchor="middle" font-size="7" fill="#6366F1">v1.0.0-beta</text>
      </g>
      
      <g transform="translate(-40, 30)">
        <rect x="0" y="0" width="48" height="16" rx="3" fill="#D4AF37" opacity="0.2"/>
        <text x="24" y="10" text-anchor="middle" font-size="7" fill="#D4AF37">v1.0.0-rc.1</text>
      </g>
    </g>
    
    <!-- Progress Indicators Section -->
    <g id="progressIndicators" transform="translate(300, -100)">
      <!-- Section Background -->
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="#0F172A" 
            stroke="#00D4FF" stroke-width="2"/>
      
      <!-- Section Title -->
      <text x="0" y="-35" text-anchor="middle" font-size="10" font-weight="bold" fill="#00D4FF">
        PROGRESS
      </text>
      
      <!-- Progress Bar Examples -->
      <!-- 100% -->
      <g transform="translate(-40, -10)">
        <rect x="0" y="0" width="80" height="8" rx="4" fill="#0A0A0F" stroke="#00D4FF" stroke-width="1"/>
        <rect x="0" y="0" width="80" height="8" rx="4" fill="url(#progressVerified)"/>
        <text x="85" y="6" font-size="7" fill="#00D4FF">100%</text>
      </g>
      
      <!-- 50% -->
      <g transform="translate(-40, 5)">
        <rect x="0" y="0" width="80" height="8" rx="4" fill="#0A0A0F" stroke="#6366F1" stroke-width="1"/>
        <rect x="0" y="0" width="40" height="8" rx="4" fill="url(#progressReported)"/>
        <text x="85" y="6" font-size="7" fill="#6366F1">50%</text>
      </g>
      
      <!-- 25% -->
      <g transform="translate(-40, 20)">
        <rect x="0" y="0" width="80" height="8" rx="4" fill="#0A0A0F" stroke="#D4AF37" stroke-width="1"/>
        <rect x="0" y="0" width="20" height="8" rx="4" fill="url(#progressPending)"/>
        <text x="85" y="6" font-size="7" fill="#D4AF37">25%</text>
      </g>
      
      <!-- 0% -->
      <g transform="translate(-40, 35)">
        <rect x="0" y="0" width="80" height="8" rx="4" fill="#0A0A0F" stroke="#EF4444" stroke-width="1"/>
        <rect x="0" y="0" width="0" height="8" rx="4" fill="url(#progressBlocked)"/>
        <text x="85" y="6" font-size="7" fill="#EF4444">0%</text>
      </g>
    </g>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 550)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#00D4FF">LEGEND:</text>
    
    <g transform="translate(0, 20)">
      <circle cx="10" cy="0" r="15" fill="url(#nodeGradient)" stroke="#D4AF37" stroke-width="1"/>
      <text x="30" y="5" font-size="10" fill="#F8F9FA">Release Node</text>
    </g>
    
    <g transform="translate(0, 50)">
      <circle cx="10" cy="0" r="20" fill="none" stroke="#00D4FF" stroke-width="2" 
              stroke-dasharray="125.66" stroke-dashoffset="12.57"/>
      <text x="35" y="5" font-size="10" fill="#00D4FF">Progress Ring</text>
    </g>
    
    <g transform="translate(0, 80)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#00D4FF" stroke-width="1" stroke-dasharray="2,1"/>
      <text x="45" y="5" font-size="10" fill="#00D4FF">Dependency Connector</text>
    </g>
    
    <g transform="translate(250, 20)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#00D4FF" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#00D4FF">VERIFIED</text>
    </g>
    
    <g transform="translate(250, 50)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#6366F1" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#6366F1">REPORTED</text>
    </g>
    
    <g transform="translate(250, 80)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#D4AF37" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#D4AF37">PENDING</text>
    </g>
    
    <g transform="translate(400, 20)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#EF4444" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#EF4444">BLOCKED</text>
    </g>
    
    <g transform="translate(400, 50)">
      <rect x="0" y="-5" width="36" height="16" rx="4" fill="#7C2D12" opacity="0.2"/>
      <text x="45" y="5" font-size="8" fill="#7C2D12">FAILED</text>
    </g>
  </g>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Governance Diagram - Release Status</dc:title>
        <dc:description xmlns:dc="http://purl.org/dc/elements/1.1/">
          Template for release status diagrams with progress rings, version tags, dependency trees, and status indicators.
          Part of the Fisk Dimension x Omega-9 Canonical Visual System.
        </dc:description>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Fisk Dimension Design System</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2024</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
</svg>
